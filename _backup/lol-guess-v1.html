<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOL 猜英雄 - 柿子工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1526; --card:#141c30; --card2:#1a2440;
  --gold:#c8aa6e; --gold2:#a9873f; --blue:#0ac8b9; --blue2:#097b72;
  --text:#e8e6e3; --muted:#8a93a8; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;}
button{font-family:inherit;}
body{background:radial-gradient(1200px 600px at 20% -10%, #15203c 0%, var(--bg) 55%);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
a{color:var(--gold);text-decoration:none;}
.wrap{max-width:860px;margin:0 auto;padding:16px;}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a3d,#ff5e3a);display:flex;align-items:center;justify-content:center;font-size:18px;}
.streak{background:var(--card);border:1px solid #223;border-radius:12px;padding:6px 14px;font-size:14px;color:var(--muted);}
.streak b{color:var(--gold);font-size:18px;margin-left:4px;}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px;}
.tab{flex:1;min-width:96px;padding:10px 8px;border-radius:12px;background:var(--card);border:1px solid #22314d;color:var(--muted);cursor:pointer;text-align:center;font-size:13px;transition:.15s;user-select:none;}
.tab:hover{border-color:var(--gold);color:var(--text);}
.tab.active{background:linear-gradient(135deg,#1c2a4a,#14203a);border-color:var(--gold);color:var(--gold);font-weight:600;}
.tab .ic{display:block;font-size:18px;margin-bottom:2px;}
/* card */
.card{background:var(--card);border:1px solid #22314d;border-radius:16px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.7;}
.qnum{color:var(--muted);font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.qnum .hint-left{color:var(--gold);}
.title{font-size:18px;font-weight:700;margin-bottom:16px;}
/* question area */
.qarea{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;background:var(--bg2);border:1px dashed #2a3a5e;border-radius:12px;padding:24px;text-align:center;}
.play-btn{width:110px;height:110px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%, #24406e, #14203a 70%);color:var(--gold);font-size:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 0 30px rgba(200,170,110,.25);}
.play-btn:hover{transform:scale(1.05);box-shadow:0 0 44px rgba(200,170,110,.4);}
.play-btn:active{transform:scale(.97);}
.play-btn.playing{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(200,170,110,.3);}50%{box-shadow:0 0 44px rgba(200,170,110,.65);}}
.splash-box{width:100%;height:240px;border-radius:10px;overflow:hidden;position:relative;background:#000;}
.splash-box img{position:absolute;max-width:none;}
.icon-row{display:flex;gap:14px;justify-content:center;}
.icon-row .ab{width:76px;height:76px;border-radius:12px;background:#0d1626;border:1px solid #2a3a5e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
.icon-row .ab img{width:52px;height:52px;border-radius:8px;object-fit:cover;}
.icon-row .ab b{font-size:11px;color:var(--gold);margin-top:3px;}
.emoji-big{font-size:64px;line-height:1.2;letter-spacing:6px;}
.hint-text{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.7;}
/* attrs (classic) */
.attrs{width:100%;margin-top:6px;display:flex;flex-direction:column;gap:6px;text-align:left;}
.attr{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#0d1626;font-size:13px;}
.attr .k{color:var(--muted);}
.attr .v{font-weight:600;}
.ok{color:var(--ok)!important;} .warn{color:var(--warn)!important;} .bad{color:var(--bad)!important;}
.attr .v.ok,.attr .v.warn,.attr .v.bad{background:rgba(0,0,0,.25);padding:3px 8px;border-radius:8px;display:inline-block;justify-self:start;}
/* input */
.guess-row{display:flex;gap:10px;margin-top:18px;}
.guess-row input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid #2a3a5e;background:#0d1626;color:var(--text);font-size:15px;outline:none;}
.guess-row input:focus{border-color:var(--gold);}
.guess-row button{padding:12px 22px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0e1a;font-weight:700;cursor:pointer;font-size:15px;}
.guess-row button:hover{filter:brightness(1.1);}
.guess-row button:disabled{opacity:.5;cursor:not-allowed;}
/* feedback */
.feed{margin-top:14px;font-size:14px;line-height:1.8;min-height:28px;}
.feed .row{padding:8px 12px;border-radius:10px;margin-bottom:6px;}
.feed .right{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);}
.feed .wrong{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:#fda4a4;}
.feed .info{background:rgba(200,170,110,.08);border:1px solid rgba(200,170,110,.25);color:var(--gold);}
.reveal{display:flex;gap:14px;align-items:center;margin-top:10px;padding:12px;border-radius:12px;background:linear-gradient(135deg,#1a2440,#121b30);border:1px solid var(--gold);}
.reveal img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:2px solid var(--gold);}
.reveal .who{font-size:17px;font-weight:700;color:var(--gold);}
.reveal .who small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px;}
.small-btn{margin-top:12px;padding:8px 16px;border-radius:10px;border:1px solid #2a3a5e;background:#0d1626;color:var(--muted);cursor:pointer;font-size:13px;}
.small-btn:hover{border-color:var(--gold);color:var(--text);}
/* footer */
.foot{text-align:center;padding:24px 0 30px;color:var(--muted);font-size:13px;}
.back{display:inline-block;margin-top:8px;padding:8px 18px;border:1px solid #2a3a5e;border-radius:10px;}
@media (max-width:600px){
  .tab{min-width:calc(33.33% - 6px);}
  .attr{grid-template-columns:64px 1fr 1fr;font-size:12px;}
  .play-btn{width:96px;height:96px;font-size:38px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html"><span class="dot">🍅</span> LOL 猜英雄</a>
    <div class="streak">连胜 <b id="streakNum">0</b></div>
  </header>

  <nav class="tabs" id="tabs">
    <div class="tab active" data-mode="classic"><span class="ic">🎯</span>经典</div>
    <div class="tab" data-mode="quote"><span class="ic">🎤</span>台词</div>
    <div class="tab" data-mode="sound"><span class="ic">⚡</span>音效</div>
    <div class="tab" data-mode="ability"><span class="ic">🎨</span>技能</div>
    <div class="tab" data-mode="emoji"><span class="ic">😀</span>表情</div>
    <div class="tab" data-mode="splash"><span class="ic">🖼️</span>原画</div>
  </nav>

  <div class="card">
    <div class="qnum">
      <span id="modeName">经典模式</span>
      <span class="hint-left" id="hintLeft"></span>
    </div>
    <div class="title" id="qTitle">听声音猜出是哪位英雄</div>
    <div class="qarea" id="qarea"></div>

    <div class="guess-row">
      <input id="guessInput" placeholder="输入英雄名字（支持中文 / 英文 / 外号）" autocomplete="off" autofocus>
      <button id="guessBtn">猜！</button>
    </div>
    <div class="feed" id="feed"></div>
    <button class="small-btn" id="skipBtn" style="display:none">跳过此题（不算连胜）</button>
  </div>

  <footer class="foot">
    数据来源：Riot Games Data Dragon / CommunityDragon · 粉丝自制，与拳头游戏无关
    <br><a class="back" href="index.html">← 返回工具箱</a>
  </footer>
</div>

<script>
"use strict";
/* ===================== 数据 ===================== */
let HEROES = [];        // 全部英雄数据（从 manifest.json 加载）
let MODES = {
  classic:{name:"经典模式",title:"根据属性提示，猜出是哪位英雄"},
  quote:{name:"台词模式",title:"听这句语音，猜出是哪位英雄"},
  sound:{name:"音效模式",title:"听技能音效，猜出是哪位英雄"},
  ability:{name:"技能模式",title:"看技能图标，猜出是哪位英雄"},
  emoji:{name:"表情模式",title:"看表情包，猜出是哪位英雄"},
  splash:{name:"原画模式",title:"看局部原画，猜出是哪位英雄"}
};
/* 别名表：猜对即算 */
const ALIAS = {
  "MonkeyKing":["悟空","猴子","孙悟空","齐天大圣"],"XinZhao":["赵信","信"],
  "MissFortune":["好运姐","赏金","女枪"],"Leblanc":["妖姬","诡术妖姬"],
  "MasterYi":["剑圣","易大师","无极剑圣"],"Tryndamere":["蛮王","蛮族之王"],
  "Chogath":["大虫子","虚空恐惧"],"Amumu":["木乃伊","殇之木乃伊"],
  "Blitzcrank":["机器人","布里茨"],"LeeSin":["盲僧","李青","李星"],
  "Ashe":["寒冰","艾希","寒冰射手"],"Caitlyn":["女警","凯特琳","皮城女警"],
  "Graves":["男枪","格雷福斯"],"Brand":["火男","布兰德"],"Orianna":["发条","奥莉安娜"],
  "Teemo":["提莫","迅捷斥候"],"Karthus":["死歌","卡尔萨斯"],"Janna":["风女","迦娜"],
  "Sona":["琴女","娑娜"],"Irelia":["刀妹","艾瑞莉娅"],"Jax":["武器","贾克斯"],
  "Morgana":["莫甘娜","堕落天使"],"Kayle":["天使","凯尔"],"Alistar":["牛头","阿利斯塔"],
  "Olaf":["奥拉夫","狂战士"],"Ryze":["瑞兹","符文法师"],"Twitch":["老鼠","图奇"],
  "Shaco":["小丑","萨科"],"Anivia":["冰鸟","艾尼维亚"],"Annie":["安妮","黑暗之女"]
};
const canon = s => String(s||"").toLowerCase().replace(/[\s'"\-]/g,"");
/* ===================== 状态 ===================== */
let state = { mode:"classic", hero:null, streak:0, tries:0, maxTries:5, playing:false, audio:null, usedHints:0 };

/* ===================== 工具 ===================== */
const $ = id => document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(hero){
  const q = canon(hero.cn), e = canon(hero.id);
  const aliases = (ALIAS[hero.id]||[]).map(canon);
  return [q, e, ...aliases].includes(canon(document.getElementById("guessInput").value));
}
function playAudio(url, cb){
  if(state.audio){ try{ state.audio.pause(); }catch(e){} state.audio = null; }
  const a = new Audio(url);
  state.audio = a;
  a.play().then(()=>{ state.playing = true; }).catch(()=>{ if(cb) cb(false); });
  a.onended = ()=>{ state.playing = false; };
  if(cb) a.onerror = ()=>{ state.playing = false; cb(false); };
}

/* ===================== 渲染 ===================== */
function renderQuestion(){
  const area = $("qarea"), hero = state.hero, mode = state.mode;
  $("qTitle").textContent = MODES[mode].title;
  $("modeName").textContent = MODES[mode].name;
  $("hintLeft").textContent = "";
  area.innerHTML = "";
  state.playing = false;
  if(mode === "classic"){
    area.innerHTML = `<div class="attrs" id="attrs"></div>`;
    renderClassicAttrs(hero, null);
  } else if(mode === "quote" || mode === "sound"){
    const file = mode === "quote" ? hero.vo : hero.sfx;
    area.innerHTML = `<button class="play-btn" id="playBtn">▶</button>
      <div class="hint-text">${mode==="quote"?"可以反复试听，听不出就用提示":"可以反复试听技能音效"}</div>`;
    $("playBtn").onclick = ()=>{ playAudio(file); };
  } else if(mode === "ability"){
    const keys = ["q","w","e","r"];
    const one = keys[Math.floor(Math.random()*4)];
    const show = Math.random() < .5 ? [one] : shuffle(keys.slice()).slice(0,2);
    area.innerHTML = `<div class="icon-row">` + show.map(k=>
      `<div class="ab"><img src="${hero.icons[k]}" alt="${k.toUpperCase()}"><b>${k.toUpperCase()}</b></div>`).join("") + `</div>
      <div class="hint-text">识别技能图标，猜英雄（Q/W/E/R 中的技能）</div>`;
  } else if(mode === "emoji"){
    area.innerHTML = `<div class="emoji-big">${hero.emoji}</div>
      <div class="hint-text">看这组表情，猜是哪位英雄</div>`;
  } else if(mode === "splash"){
    area.innerHTML = `<div class="splash-box" id="splashBox"><img id="splashImg" alt=""></div>
      <div class="hint-text">原画局部放大，猜是哪位英雄</div>`;
    const img = $("splashImg");
    img.src = hero.splash;
    img.onload = ()=>{
      const box = $("splashBox"), bw = box.clientWidth, bh = box.clientHeight;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const zoom = 2.6 + Math.random()*1.4;
      const w = iw*zoom, h = ih*zoom;
      img.style.width = w+"px"; img.style.height = h+"px";
      img.style.left = -Math.random()*(w-bw)+"px";
      img.style.top  = -Math.random()*(h-bh)+"px";
    };
  }
  $("feed").innerHTML = "";
  $("skipBtn").style.display = "none";
  $("guessInput").value = "";
  $("guessInput").focus();
  state.tries = 0; state.usedHints = 0;
  renderTries();
}

function renderClassicAttrs(hero, guessHero){
  const rows = [
    ["性别","gender"],["位置","lanes"],["种族","species"],["资源","partype"],
    ["射程","rangeType"],["区域","region"],["发布年份","year"]
  ];
  let html = "";
  if(guessHero){
    rows.forEach(([k,key])=>{
      const a = hero[key], b = guessHero[key];
      const same = a === b;
      const sameArr = Array.isArray(a) && Array.isArray(b) && a.some(x=>b.includes(x));
      const cls = same ? "ok" : (sameArr ? "warn" : "bad");
      const va = Array.isArray(a) ? a.join("/") : a;
      const vb = Array.isArray(b) ? b.join("/") : b;
      html += `<div class="attr"><span class="k">${k}</span><span class="v ${same?"ok":""}">${va}</span><span class="v ${cls}">${vb}</span></div>`;
    });
  } else {
    rows.forEach(([k,key])=>{
      const v = Array.isArray(hero[key]) ? hero[key].join("/") : hero[key];
      html += `<div class="attr"><span class="k">${k}</span><span class="v">${v}</span><span class="v" style="color:var(--muted)">？？</span></div>`;
    });
  }
  $("attrs").innerHTML = html;
}

function renderTries(){
  $("hintLeft").textContent = state.mode==="classic" ? "" : `剩余提示 ${Math.max(0,state.maxTries-state.usedHints)} 次`;
}

function revealHero(correct){
  const hero = state.hero, area = $("qarea");
  const feed = $("feed");
  feed.innerHTML = `<div class="reveal"><img src="${hero.splash}"><div class="who">${hero.cn} <small>${hero.id} · ${hero.title}</small></div></div>`;
  $("skipBtn").style.display = "none";
  const btn = document.createElement("button");
  btn.className = "small-btn";
  btn.textContent = correct ? "下一题 →" : "再来一题 →";
  btn.onclick = nextQuestion;
  feed.appendChild(btn);
}

/* ===================== 逻辑 ===================== */
function nextQuestion(){
  const pool = shuffle(HEROES.slice());
  state.hero = pool[0];
  renderQuestion();
}

function guess(){
  const input = $("guessInput").value.trim();
  if(!input) return;
  const hero = state.hero;
  const feed = $("feed");
  if(pick(hero)){
    state.streak++;
    $("streakNum").textContent = state.streak;
    feed.innerHTML = `<div class="row right">✔ 答对了！是 ${hero.cn}（${hero.id}）· 连胜 ${state.streak}</div>`;
    revealHero(true);
  } else {
    state.streak = 0;
    $("streakNum").textContent = 0;
    if(state.mode === "classic"){
      const guessHero = HEROES.find(h => canon(h.cn)===canon(input) || canon(h.id)===canon(input) || (ALIAS[h.id]||[]).map(canon).includes(canon(input)));
      if(guessHero){
        feed.innerHTML = `<div class="row wrong">✘ 不是 ${input}，对比一下：</div>`;
        renderClassicAttrs(hero, guessHero);
      } else {
        feed.innerHTML = `<div class="row wrong">✘ 没这个英雄，再试试（支持中文名 / 英文名 / 外号）</div>`;
      }
    } else {
      state.tries++;
      const left = state.maxTries - state.usedHints;
      feed.innerHTML = `<div class="row wrong">✘ 不对，再试试（剩余 ${left} 次提示）</div>`;
    }
    $("skipBtn").style.display = "inline-block";
  }
}

function hint(){
  const hero = state.hero;
  if(state.mode === "classic") return;
  if(state.usedHints >= state.maxTries){
    $("feed").innerHTML = `<div class="row info">提示用完了，跳过或继续猜</div>`;
    return;
  }
  state.usedHints++;
  renderTries();
  let msg = "";
  if(state.mode === "quote" || state.mode === "sound"){
    const n = hero.cn.length;
    msg = `提示：名字 ${n} 个字，首字「${hero.cn[0]}」`;
  } else if(state.mode === "ability"){
    msg = `提示：TA 是${hero.lanes.map(l=>"「"+l+"」").join("")}英雄，${hero.rangeType==="远程"?"远程":"近战"}`;
  } else if(state.mode === "emoji"){
    msg = `提示：性别 ${hero.gender} · ${hero.species} · ${hero.region}`;
  } else if(state.mode === "splash"){
    msg = `提示：这个英雄 ${hero.year} 年上线 · ${hero.lanes.join("/")}`;
  }
  $("feed").innerHTML = `<div class="row info">💡 ${msg}</div>`;
}

function skip(){
  state.streak = 0;
  $("streakNum").textContent = 0;
  $("feed").innerHTML = `<div class="row info">跳过，正确答案是 ${state.hero.cn}</div>`;
  revealHero(false);
}

/* ===================== 事件 ===================== */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    state.mode = t.dataset.mode;
    nextQuestion();
  };
});
$("guessBtn").onclick = guess;
$("guessInput").addEventListener("keydown", e=>{ if(e.key==="Enter") guess(); });
$("skipBtn").onclick = skip;

/* ===================== 启动 ===================== */
