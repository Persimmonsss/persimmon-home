<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOL 猜英雄 - 柿子工具箱</title>
<link rel="icon" type="image/png" href="icon_persimmon.png">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1526; --card:#141c30; --card2:#1a2440;
  --gold:#c8aa6e; --gold2:#a9873f; --blue:#0ac8b9; --blue2:#097b72;
  --text:#e8e6e3; --muted:#8a93a8; --ok:#3fb950; --warn:#d29922; --bad:#e5534b;
  --cell-ok:#1b5e20; --cell-part:#7a4d0d; --cell-bad:#6b1f1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
button{font-family:inherit;}
body{background:radial-gradient(1200px 600px at 20% -10%, #15203c 0%, var(--bg) 55%);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
a{color:var(--gold);text-decoration:none;}
.wrap{max-width:980px;margin:0 auto;padding:16px;}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a3d,#ff5e3a);display:flex;align-items:center;justify-content:center;font-size:18px;}
.streak{background:var(--card);border:1px solid #223;border-radius:12px;padding:6px 14px;font-size:14px;color:var(--muted);}
.streak b{color:var(--gold);font-size:18px;margin-left:4px;}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px;}
.tab{flex:1;min-width:100px;padding:10px 8px;border-radius:12px;background:var(--card);border:1px solid #22314d;color:var(--muted);cursor:pointer;text-align:center;font-size:13px;transition:.15s;user-select:none;}
.tab:hover{border-color:var(--gold);color:var(--text);}
.tab.active{background:linear-gradient(135deg,#1c2a4a,#14203a);border-color:var(--gold);color:var(--gold);font-weight:600;}
.tab .ic{display:block;font-size:18px;margin-bottom:2px;}
/* card */
.card{background:var(--card);border:1px solid #22314d;border-radius:16px;padding:20px;margin-bottom:16px;position:relative;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.7;}
.qnum{color:var(--muted);font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.qnum .hint-left{color:var(--gold);}
.qnum .actions{display:flex;gap:8px;align-items:center;}
/* 图例 */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 16px;padding:10px 12px;background:var(--bg2);border:1px solid #22314d;border-radius:10px;font-size:12px;color:var(--muted);}
.legend .lg{display:inline-flex;align-items:center;gap:5px;}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;}
.sw-ok{background:var(--cell-ok);} .sw-part{background:var(--cell-part);} .sw-bad{background:var(--cell-bad);}
/* 输入 */
.guess-row{display:flex;gap:10px;margin-top:14px;position:relative;}
.guess-input-wrap{position:relative;flex:1;}
#guessInput{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid #2a3a5e;color:var(--text);font-size:15px;outline:none;transition:.15s;}
#guessInput:focus{border-color:var(--gold);}
.btn{padding:12px 22px;border-radius:12px;border:1px solid #2a3a5e;background:var(--card2);color:var(--text);cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap;}
.btn:hover{border-color:var(--gold);}
.btn-gold{background:linear-gradient(135deg,#c8aa6e,#a9873f);border:none;color:#0a0e1a;font-weight:700;}
.btn-gold:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--gold);border-color:var(--gold);}
/* 下拉匹配 */
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#0d1626;border:1px solid #2a3a5e;border-radius:12px;max-height:300px;overflow-y:auto;z-index:100;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5);}
.suggest.show{display:block;}
.sug-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #16213a;}
.sug-item:last-child{border-bottom:none;}
.sug-item:hover,.sug-item.sel{background:#1c2a4a;}
.sug-item img{width:34px;height:34px;border-radius:8px;background:#000;}
.sug-item .nm{font-size:14px;font-weight:600;}
.sug-item .tt{font-size:12px;color:var(--muted);margin-left:6px;}
/* 对比表（经典） */
.tbl-wrap{overflow-x:auto;margin-top:16px;border-radius:10px;border:1px solid #22314d;}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
table.cmp th{background:#0d1626;color:var(--muted);padding:8px 10px;font-weight:600;text-align:left;border-bottom:1px solid #22314d;white-space:nowrap;}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;z-index:2;background:#0d1626;}
table.cmp td{padding:8px 10px;border-bottom:1px solid #16213a;white-space:nowrap;}
table.cmp tr:last-child td{border-bottom:none;}
table.cmp td.cell-ok{background:var(--cell-ok);color:#d7ffe3;font-weight:600;}
table.cmp td.cell-part{background:var(--cell-part);color:#ffe8b3;font-weight:600;}
table.cmp td.cell-bad{background:var(--cell-bad);color:#ffd6d3;}
td.hero-cell{display:flex;align-items:center;gap:8px;background:transparent!important;color:var(--text);font-weight:600;}
td.hero-cell img{width:32px;height:32px;border-radius:6px;background:#000;}
td .arr{font-size:12px;margin-left:2px;}
/* 题面 */
.qarea{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px;background:var(--bg2);border:1px dashed #2a3a5e;border-radius:12px;padding:20px;text-align:center;}
.qarea #qbody{width:100%;}
.play-btn{width:104px;height:104px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%, #24406e, #14203a 70%);color:var(--gold);font-size:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 0 30px rgba(200,170,110,.25);}
.play-btn:hover{transform:scale(1.05);box-shadow:0 0 44px rgba(200,170,110,.4);}
.play-btn.playing{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(200,170,110,.3);}50%{box-shadow:0 0 44px rgba(200,170,110,.65);}}
.splash-box{width:100%;height:230px;border-radius:10px;overflow:hidden;position:relative;background:#000;}
.splash-box img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.icon-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.icon-row .ab{width:82px;height:86px;border-radius:12px;background:#0d1626;border:1px solid #2a3a5e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);}
.icon-row .ab img{width:54px;height:54px;border-radius:8px;object-fit:cover;}
.sfx-btn{cursor:pointer;transition:.15s;}
.sfx-btn:hover{border-color:var(--gold);color:var(--gold);}
.sfx-btn .sfx-key{font-size:18px;font-weight:700;color:var(--gold);}
.sfx-btn .sfx-play{font-size:11px;color:var(--muted);}
.sfx-btn:disabled{opacity:.35;cursor:not-allowed;}
.sfx-btn.playing{border-color:#7fff00;color:#7fff00;}
.emoji-big{font-size:60px;line-height:1.2;letter-spacing:6px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;margin:14px auto 0;}
.opt-btn{padding:14px 16px;border-radius:12px;background:var(--card2);border:1px solid #2a3a5e;color:var(--text);font-size:15px;cursor:pointer;transition:.15s;font-weight:600;}
.opt-btn:hover{border-color:var(--gold);color:var(--gold);}
.opt-btn.ok{background:var(--cell-ok);border-color:var(--ok);color:#d7ffe3;}
.opt-btn.bad{background:var(--cell-bad);border-color:var(--bad);color:#ffd6d3;}
.opt-btn.dis{opacity:.35;cursor:not-allowed;}
.qz-q{font-size:17px;font-weight:600;line-height:1.7;max-width:640px;margin-bottom:4px;}
.ask-wrap{display:flex;flex-direction:column;gap:12px;}
.ask-input-row{display:flex;gap:8px;}
.ask-input-row input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border .2s;}
.ask-input-row input:focus{border-color:var(--gold);}
.ask-chips{display:flex;flex-wrap:wrap;gap:7px;max-height:170px;overflow-y:auto;padding-right:2px;}
.ask-chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;transition:all .2s;text-align:left;}
.ask-chip:hover{border-color:var(--gold);color:#f3e2c7;}
.ask-chip.done{opacity:.38;text-decoration:line-through;pointer-events:none;}
.ask-log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.ask-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;animation:feedIn .25s ease;}
.ask-row .aq{color:var(--text);flex:1;}
.ask-row .aa{font-weight:700;flex-shrink:0;}
.ask-row.yes .aa{color:#7ed18c;}
.ask-row.no .aa{color:#e58a7a;}
.ask-remain{font-size:13px;color:var(--gold);font-weight:700;}
.qz-note{font-size:13px;color:var(--muted);margin-top:8px;max-width:640px;}
.hint-text{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.7;}
/* feed */
.feed{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.feed .row{padding:10px 14px;border-radius:10px;font-size:14px;}
.feed .row.ok{background:rgba(63,185,80,.12);border:1px solid var(--cell-ok);color:#a7f3bd;}
.feed .row.bad{background:rgba(229,83,75,.12);border:1px solid var(--cell-bad);color:#fecaca;}
.feed .row.info{background:rgba(210,153,34,.12);border:1px solid var(--cell-part);color:#fde68a;}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(4,8,16,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-mask.show{display:flex;}
.modal{background:linear-gradient(160deg,#16203a,#0d1428);border:1px solid var(--gold);border-radius:20px;max-width:420px;width:100%;padding:26px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.7);max-height:90vh;overflow-y:auto;}
.modal .m-hero{width:96px;height:96px;border-radius:14px;object-fit:cover;border:2px solid var(--gold);background:#000;}
.modal h2{color:var(--gold);font-size:26px;margin:12px 0 4px;}
.modal .m-name{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal .m-tries{color:var(--muted);font-size:14px;margin:10px 0;}
.modal .m-stats{background:var(--bg2);border-radius:12px;padding:12px;margin:12px 0;text-align:left;}
.modal .m-stats h3{font-size:13px;color:var(--muted);margin-bottom:8px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;color:var(--muted);}
.bar-row .bar{flex:1;height:16px;background:#0d1626;border-radius:4px;overflow:hidden;position:relative;}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;}
.bar-row .n{width:14px;text-align:right;}
.modal .m-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.modal .m-share{background:var(--bg2);border:1px solid #2a3a5e;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--muted);word-break:break-all;text-align:left;max-height:110px;overflow-y:auto;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c2a4a;border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:12px;font-size:14px;z-index:200;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.toast.show{display:block;animation:toastin .25s;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
@media (max-width:640px){
  .tabs{gap:6px;}
  .tab{min-width:70px;font-size:12px;padding:8px 4px;}
  .modal{max-width:96%;padding:20px;}
}
/* ===== 丝滑动效 ===== */
.card,.btn,.tab,.sug-item,.opt-btn{transition:all .22s ease;}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35);}
.btn:active{transform:scale(.95);}
@keyframes feedIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
#feed .row{animation:feedIn .32s ease both;}
@keyframes modalPop{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-mask .modal{animation:modalPop .3s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes rowFlash{0%{background:rgba(200,168,110,.30);}100%{background:transparent;}}
.cmp tbody tr:first-child{animation:rowFlash 1.4s ease .25s both;}
@keyframes streakPop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
#streakNum{display:inline-block;}
.streak-pop{animation:streakPop .45s ease;}
.splash-box,.splash-box img{transition:transform .55s cubic-bezier(.25,.8,.3,1);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.toast{animation:toastIn .25s ease both;}
html{scroll-behavior:smooth;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="dot">⚔️</div>LOL 猜英雄</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="streak">连胜 <b id="streakNum">0</b></div>
      <button class="btn btn-ghost" id="topShareBtn" style="padding:5px 10px;font-size:12px;">📤 分享</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="classic"><span class="ic">⚔️</span>经典</div>

    <div class="tab" data-mode="sfx"><span class="ic">🔊</span>音效</div>
    <div class="tab" data-mode="ability"><span class="ic">🧩</span>技能</div>
    <div class="tab" data-mode="emoji"><span class="ic">🎭</span>表情</div>

    <div class="tab" data-mode="ask"><span class="ic">❓</span>提问猜英雄</div>
  </div>
  <div class="card">
    <div class="qnum">
      <span class="mode-title" id="modeTitle">经典模式</span>
      <span class="actions">
        <span class="hint-left" id="hintLeft"></span>
        <button class="btn btn-ghost" id="hintBtn" style="padding:6px 12px;font-size:13px;">💡 提示</button>

      <span class="lg"><span class="sw sw-ok"></span>正确</span>

      <div class="guess-input-wrap">
        <input id="guessInput" placeholder="输入英雄名字（支持中文 / 英文 / 外号）" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <button class="btn btn-gold" id="guessBtn">猜！</button>
      <button class="btn btn-ghost" id="skipBtn">跳过</button>
    </div>
    <div class="feed" id="feed"></div>
    <div class="tbl-wrap" id="tblWrap" style="display:none;"></div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:12px;padding:10px 0;">
    数据来源：Riot Games Data Dragon / CommunityDragon · 粉丝自制，与拳头游戏无关 ·
    <a href="index.html">← 返回工具箱</a>
  </div>
</div>

<!-- 分享面板 -->
<div class="modal-mask" id="shareModal">
  <div class="modal" style="max-width:380px;text-align:center;">
    <h2 style="margin:0 0 6px;">分享给朋友</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:12px;">朋友扫二维码或点链接，立刻开玩</div>
    <div id="shareQr" style="display:inline-block;background:#fff;padding:8px;border-radius:10px;margin-bottom:12px;"></div>

      <button class="btn btn-gold" id="shareCopyBtn" style="width:100%;">📋 复制文案</button>
      <button class="btn btn-ghost" id="shareSysBtn" style="width:100%;">📤 系统分享</button>
      <button class="btn btn-ghost" id="shareCloseBtn" style="width:100%;">关闭</button>

</div>

<!-- 胜利弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <img class="m-hero" id="mHero" alt="">
    <h2>胜利！</h2>
    <div class="m-name" id="mName"></div>
    <div class="m-tries" id="mTries"></div>

      <h3 id="mStatsTitle">统计数据</h3>
      <div id="mStats"></div>

</div>

<script>
/* ===================== 常量与映射 ===================== */
const MODE_NAMES = {classic:"经典模式", quote:"台词模式", sfx:"音效模式", ability:"技能模式", emoji:"表情模式", splash:"原画模式", trophy:"冠军皮肤", quiz:"知识问答", ask:"提问猜英雄"};
const G = {
  gender:{Male:"男", Female:"女", Other:"其他"},
  lane:{TOP:"上单", JUNGLE:"打野", MIDDLE:"中单", BOTTOM:"下路", SUPPORT:"辅助"},
  species:{Human:"人类", Darkin:"暗裔", Vastayan:"瓦斯塔亚人", Minotaur:"牛头人", Undead:"亡灵", Yordle:"约德尔人", God:"神", Spirit:"灵体", Magicborn:"魔法师", Iceborn:"冰裔", Dragon:"龙", Celestial:"星灵", "God-Warrior":"天神战士", Ascended:"飞升者", Voidborn:"虚空生物", Golem:"魔像", "Magically Altered":"魔法改造", Construct:"造物", Vampire:"吸血鬼", Cyborg:"机械改造", Aspect:"星灵载体", "Chemically Altered":"化学改造", Demon:"恶魔", Unknown:"未知", Spiritualist:"灵魂行者", "Void-Touched":"虚空侵蚀", Dog:"犬", Yeti:"雪人", Brackern:"壳人族", Troll:"巨魔", Hemomancer:"血术师", Cat:"猫", Plant:"植物"},
  resource:{MANA:"法力", ENERGY:"能量", NONE:"无耗材", BLOOD_WELL:"鲜血魔井", FRENZY:"狂暴", HEALTH:"生命值", RAGE:"怒气", COURAGE:"勇气", SHIELD:"护盾", FURY:"怒意", FEROCITY:"残暴值", HEAT:"热量", GRIT:"豪意", CRIMSON_RUSH:"猩红冲刺", FLOW:"剑意"},
  range:{Melee:"近战", Ranged:"远程"},
  region:{ionia:"艾欧尼亚", noxus:"诺克萨斯", freljord:"弗雷尔卓德", demacia:"德玛西亚", piltover:"皮尔特沃夫", zaun:"祖安", shurima:"恕瑞玛", "mount-targon":"巨神峰", void:"虚空", bilgewater:"比尔吉沃特", "shadow-isles":"暗影岛", "bandle-city":"班德尔城", ixtal:"以绪塔尔", unaffiliated:"独立阵营"}
};
const tL = (m,v)=> (G[m]&&G[m][v])||v;
const tLArr = (m,arr)=> arr.map(v=>tL(m,v)).join(" / ");
/* ===================== 状态 ===================== */
const $ = id=>document.getElementById(id);
let HEROES = [], TROPHY = null, state = {};
const STAT_KEY = "lol_guess_stats_v2";
function loadStats(){

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function guessCandidates(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const pool = state.mode==="ask" ? (state.askCands||HEROES) : HEROES;
  return pool.filter(h=>{
    if(h.cn.toLowerCase().includes(q) || h.title.toLowerCase().includes(q) || h.id.toLowerCase().includes(q)) return true;
    if(h.keywords && h.keywords.toLowerCase().split(",").some(k=>k && k.toLowerCase().includes(q))) return true;
    return false;
  }).slice(0,8);
}
/* ===================== 对比逻辑（经典） ===================== */
function cmpEqual(a,b){ return a===b ? "ok" : "bad"; }
function cmpList(a,b){
  if(a.length===0 && b.length===0) return "ok";
  const inter = a.filter(x=>b.includes(x));
  if(inter.length===a.length && inter.length===b.length) return "ok";
  return inter.length>0 ? "part" : "bad";
}
function cmpYear(g,a){ if(g===a) return "ok"; return g>a ? "low" : "high"; }
function heroCell(h){
  return `<div class="hero-cell"><img src="${h.head}" alt="">${h.cn}</div>`;
}
function cmpRow(h){
  const a = state.hero, g = h;
  const cells = [
    cmpEqual(g.gender, a.gender),
    cmpList(g.lanes, a.lanes),
    cmpList(g.species, a.species),
    cmpEqual(g.resource, a.resource),
    cmpEqual(g.rangeType, a.rangeType),
    cmpList(g.region, a.region),
    cmpYear(g.year, a.year),
  ];
  const val = [
    tL("gender", g.gender),
    tLArr("lane", g.lanes),
    tLArr("species", g.species),
    tL("resource", g.resource),
    tL("range", g.rangeType),
    tLArr("region", g.region),
    String(g.year),
  ];
  return {cells, val};
}

const OPENS = [

function askNorm(s){
  return s.toLowerCase()
    .replace(/[？?。，、！!；;：:～~·.…\s]+/g,"")
    .replace(/是不是|是否|可否|可不可以/g,"是")
    .replace(/吗|呢|吧|啊|呀|嘛|哦|的|地|得|一个|一位|个|名|这位|这个|那位|那个/g,"");
}
function factTest(f, vv){
  if(f.type==="enum") return h=>h[f.prop]===vv;
  return h=>{ const a = h[f.prop]||[]; return Array.isArray(a) ? a.includes(vv) : a===vv; };
}
function parseCond(sub){
  let neg = false, t = sub;
  t = t.replace(/^(不是|并非|不是个|不是位|没有|不可能|非)/, ()=>{ neg = true; return ""; });
  if(/^不/.test(t)){ t = t.replace(/^不/,""); neg = !neg; }
  for(const f of FACTS){
    if(f.type==="year"){
      const m = t.match(/(19|20)\d{2}/);
      if(m){
        const y = +m[0];
        if(/之前|以前|前|早于/.test(t)) return {label:"在 " + y + " 年之前上线", test:h=>h.year<=y, neg};
        if(/之后|以后|后|晚于/.test(t)) return {label:"在 " + y + " 年之后上线", test:h=>h.year>=y, neg};
        return {label:"在 " + y + " 年上线", test:h=>h.year===y, neg};
      }
      if(/老|元老|早期|开服/.test(t)) return {label:"是老英雄（2016 年前）", test:h=>h.year<=2016, neg};
      if(/新|近期|刚出|最新/.test(t)) return {label:"是新英雄（2019 年后）", test:h=>h.year>=2019, neg};
      continue;
    }
    for(const v of f.values){
      for(const k of v.kw){
        if(t.includes(k)) return {label:v.label, test:factTest(f, v.v), neg};
      }
    }
  }
  return null;
}
function askOpen(s){
  for(const o of OPENS){
    if(o.re.test(s)) return o;
  }
  return null;
}
function parseAsk(raw){
  const s = askNorm(raw);
  if(/还是/.test(s) && !/不是/.test(s)){ return {hint:"有选择的问题先分开问吧，比如：是法师吗？"}; }
  if(/^(你好|您好|在吗|hi|hello|嗨|嗨喽|哈喽|喂|哈罗)/.test(s) || s==="在") return {talk:"在的！问我关于英雄的问题吧，比如：是法师吗？"};
  if(/是英雄吗|是不是英雄|谁是英雄/.test(s)) return {talk:"TA 当然是一位英雄啦，快用问题缩小范围猜出 TA"};
  if(/不知道|随便|算了|跳过提问|直接猜/.test(s)) return {talk:"那就直接猜吧，输入英雄名字点「猜！」"};
  const op = askOpen(s);
  if(op) return {open:op, raw};
  const subs = s.split(/并且|而且|还|又|也|同时|以及|跟|与|还有|外加/).filter(x=>x);
  const conds = [];
  for(const sub of subs){
    const c = parseCond(sub);
    if(!c) return {sug: sub};
    conds.push(c);
  }
  if(!conds.length) return {sug: s};
  return {conds, raw};
}
function doAsk(q){

  const ans = q.neg ? !base : base;
  state.askCands = state.askCands.filter(h=>{ const b = q.test(h); return (q.neg ? !b : b) === ans; });
  pushAskLog(label, ans);

}
function doAskOpen(o, raw){

      state.tzoom = Math.max(1.0, state.tzoom - 0.4);

function pickHeroFromInput(){
  const v = $("guessInput").value.trim().toLowerCase();
  if(!v) return null;
  return HEROES.find(h=>h.cn.toLowerCase()===v || h.title.toLowerCase()===v || h.id.toLowerCase()===v) || null;
}
function slowScroll(el, target, ms){
  const start = el.scrollLeft, diff = target - start, t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - p, 3);
    el.scrollLeft = start + diff * e;
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function addCmpRow(h){
  const wrap = $("tblWrap");
  wrap.style.display = "";
  const c = cmpRow(h);
  const arrMark = {ok:"", low:"<span class='arr'>↓</span>", high:"<span class='arr'>↑</span>"};
  let t = wrap.innerHTML;
  const isNew = !t;
  if(isNew){
    t = `<table class="cmp"><thead><tr><th>英雄</th><th>性别</th><th>位置</th><th>种族</th><th>资源</th><th>射程</th><th>地区</th><th>年份</th></tr></thead><tbody>`;
    requestAnimationFrame(()=>{
      if(wrap.scrollWidth > wrap.clientWidth + 4){
        slowScroll(wrap, wrap.scrollWidth, 700);
        setTimeout(()=>{ slowScroll(wrap, 0, 700); }, 1500);
      }
    });
  } else {
    t = t.replace("</tbody></table>", "");
  }
  const row = `<tr><td>${heroCell(h)}</td>` + c.val.map((v,i)=>{
    const cl = c.cells[i]==="ok" ? "cell-ok" : c.cells[i]==="part" ? "cell-part" : "cell-bad";
    let mark = "";
    if(i===6) mark = arrMark[c.cells[i]]||"";
    return `<td class="${cl}">${v}${mark}</td>`;
  }).join("") + `</tr>`;
  t = t.replace("<tbody>", "<tbody>" + row);
  t += "</tbody></table>";
  wrap.innerHTML = t;
  wrap.scrollTop = 0;
}
/* ===================== 胜利 ===================== */
function win(){
  const h = state.hero, mode = state.mode;
  stats.streak++; stats.won++;
  stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  const modes = stats.modes[mode] = stats.modes[mode] || {dist:[]};
  const t = Math.min(state.used, 15);
  modes.dist[t-1] = (modes.dist[t-1]||0)+1;
  stats.modeWins[mode] = (stats.modeWins[mode]||0)+1;
  stats.bestTries[mode] = Math.min(stats.bestTries[mode]||99, state.used);
  stats.heroes[h.key] = (stats.heroes[h.key]||0)+1;
  saveStats(stats);
  setStreak(stats.streak);
  $("mHero").src = h.splash0;
  $("mName").textContent = `${h.cn} · ${h.title}`;
  $("mTries").textContent = mode==="ask" ? `提问 ${state.askCount} 次 · 猜测 ${state.used} 次` : `尝试次数：${state.used}`;
  $("mStatsTitle").textContent = `${MODE_NAMES[mode]} · 猜测次数分布`;
  let bars = "", mx = 0;
  for(const n of modes.dist) mx = Math.max(mx, n||0);
  for(let i=0;i<modes.dist.length;i++){
    const c = modes.dist[i]||0;
    if(!c) continue;
    bars += `<div class="bar-row"><span class="n">${i+1}</span><div class="bar"><i style="width:${Math.round(c/mx*100)}%"></i></div><span>${c}</span></div>`;
  }
  $("mStats").innerHTML = (stats.maxStreak ? `<div class="bar-row"><span>最高连胜</span><div class="bar"><i style="width:${Math.min((stats.maxStreak||0)*10,100)}%"></i></div><span class="n">${stats.maxStreak||0}</span></div>` : "") + (bars || `<div style="color:var(--muted);font-size:13px;">这是你在该模式的第一胜！</div>`);
  $("mShare").textContent = buildShare(mode, h, state.used);
  $("modal").classList.add("show");
}
function buildShare(mode, h, tries){
  let text = mode==="ask"
    ? `我在「提问猜英雄」中问了 ${state.askCount||0} 个问题，猜中了英雄 ${h.cn} ⚔️`
    : `我在 ${MODE_NAMES[mode]} 中猜中了英雄 ${h.cn}，使用了 ${tries} 次尝试 ⚔️`;
  if(mode==="classic"){
    const tbody = document.querySelector("table.cmp tbody");
    if(tbody){
      const rows = [];
      tbody.querySelectorAll("tr").forEach(tr=>{
        let line = "";
        tr.querySelectorAll("td").forEach((td,i)=>{
          if(i===0) return;
          line += td.className.includes("cell-ok")?"🟩":td.className.includes("cell-part")?"🟧":"🟥";
        });
        rows.push(line);
      });
      if(rows.length) text += "\n" + rows.join("\n");
    }
  }
  text += `\n柿子eeeee 工具箱`;
  return text;
}

}

function shareResult(){
  const text = $("mShare").textContent || "";
  const link = location.origin + location.pathname;
  const full = text + " " + link;
  if(navigator.share){
    navigator.share({title:"柿子eeeee · 猜英雄", text, url: location.href})
      .then(()=>{})
      .catch(()=>copyText(full));
    return;
  }
  copyText(full);
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("分享文案已复制，去微信粘贴吧")).catch(()=>copyFallback(t));
  } else copyFallback(t);
}
function copyFallback(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("分享文案已复制，去微信粘贴吧"); }
  catch(e){ toast("复制失败，请长按文字手动复制"); }
  document.body.removeChild(ta);
}

<script>
/* 移除平台右下角水印角标（shadow DOM .watermark-root，直接移除节点，防重注入轮询） */
(function(){
  function killBadge(){
    try{
      var list = document.querySelectorAll('body > div');
      for(var i=0;i<list.length;i++){
        var d = list[i];
        if(d.shadowRoot && d.shadowRoot.querySelector('.watermark-root')){
          if(d.parentNode) d.parentNode.removeChild(d);
        }
      }
    }catch(e){}
  }
  killBadge();
  new MutationObserver(killBadge).observe(document.body,{childList:true});
  setInterval(killBadge, 300);
})();
</script>
