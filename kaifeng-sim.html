<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炉石开包模拟器 · 柿子eeeee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--panel:#1c2330;--line:#2a3242;--text:#e6edf3;--dim:#9aa7b8;--muted:#6b7686;--gold:#c8aa6e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 40px;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.top h1{font-size:22px;color:var(--gold);}
.back{color:var(--dim);text-decoration:none;font-size:13px;}
.back:hover{color:var(--gold);}
.sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:18px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.btn{background:var(--gold);color:#161003;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:filter .2s;}
.btn:hover{filter:brightness(1.12);}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat b{display:block;font-size:20px;margin-bottom:2px;}
.stat span{color:var(--muted);font-size:12px;}
.stat.leg b{color:#ffb02e;} .stat.epic b{color:#c77dff;} .stat.rare b{color:#5fb3ff;} .stat.pity b{color:var(--gold);}
.pack{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;text-align:center;}
.pack-icon{font-size:52px;cursor:pointer;user-select:none;transition:transform .15s;display:inline-block;}
.pack-icon:hover{transform:scale(1.08);}
.pack-icon:active{transform:scale(.92);}
.pack-tip{color:var(--muted);font-size:12px;margin-top:8px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;}
.p-card{position:relative;border-radius:12px;overflow:hidden;background:#1a2130;border:1px solid var(--line);perspective:600px;height:190px;}
.p-card .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;transition:transform .6s ease;}
.p-card .back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#3a2a10,#2a1e0c 12px);color:var(--gold);justify-content:center;font-size:30px;}
.p-card.open .back{transform:rotateY(0);}
.p-card.open .front{transform:rotateY(180deg);}
.p-card .front{background:#20293a;border:3px solid #8a8a8a;}
.p-card.rare .front{border-color:#5fb3ff;box-shadow:0 0 12px rgba(95,179,255,.5);}
.p-card.epic .front{border-color:#c77dff;box-shadow:0 0 12px rgba(199,125,255,.5);}
.p-card.leg .front{border-color:#ffb02e;box-shadow:0 0 16px rgba(255,176,46,.6);}
.p-card img{width:100%;height:108px;object-fit:cover;background:#10151f;}
.p-card .pn{font-size:13px;font-weight:800;padding:5px 6px 2px;text-align:center;line-height:1.3;}
.p-card .pm{color:var(--muted);font-size:11px;padding:0 6px 4px;}
.p-card .pback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;}
.leg-list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.leg-list h3{font-size:14px;color:var(--dim);margin-bottom:8px;}
.leg-list .items{display:flex;flex-wrap:wrap;gap:6px;}
.leg-list .it{color:#ffb02e;font-size:12.5px;background:rgba(255,176,46,.08);border:1px solid rgba(255,176,46,.25);border-radius:999px;padding:3px 10px;}
.none{color:var(--muted);font-size:12.5px;}
.log{color:var(--muted);font-size:12px;line-height:1.7;margin-top:8px;}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#232b3a;color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🎁 炉石开包模拟器</h1>
    <a class="back" href="index.html">← 返回工具箱</a>
  </div>
  <p class="sub">175 张热门卡真实卡面 · 模拟炉石开包：稀有/史诗/传说概率 + 40 包传说保底。开包一时爽，一直开包一直爽。</p>
  <div class="stats">
    <div class="stat"><b id="sPack">0</b><span>开包数</span></div>
    <div class="stat leg"><b id="sLeg">0</b><span>传说</span></div>
    <div class="stat epic"><b id="sEpic">0</b><span>史诗</span></div>
    <div class="stat rare"><b id="sRare">0</b><span>稀有</span></div>
    <div class="stat pity"><b id="sPity">0</b><span>距保底(40)</span></div>
  </div>
  <div class="pack">
    <div class="pack-icon" id="packBtn" title="点我开包">🎁</div>
    <div class="pack-tip">点上面的包开一包 · 每包 5 张，至少 1 张稀有+ · 40 包保底传说</div>
  </div>
  <div class="actions">
    <button class="btn" id="oneBtn">开 1 包</button>
    <button class="btn" id="tenBtn">开 10 包</button>
    <button class="btn ghost" id="shareBtn">📋 复制战报</button>
    <button class="btn ghost" id="resetBtn">重置统计</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="leg-list">
    <h3>🏆 传说收藏（本机记录）</h3>
    <div class="items" id="legItems"></div>
  </div>
  <div class="log" id="log"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let CARDS = [], BUSY = false;
const R_CN = {COMMON:"普通",FREE:"基础",RARE:"稀有",EPIC:"史诗",LEGENDARY:"传说"};
const R_W = {COMMON:50, FREE:50, RARE:15, EPIC:4.5, LEGENDARY:1.1};
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function load(){
  if(CARDS.length) return Promise.resolve();
  return fetch("assets/hs_manifest.json").then(r=>r.json()).then(d=>{ CARDS = d.cards || []; }).catch(()=>{ toast("卡牌数据加载失败，请检查网络"); });
}
function stats(){
  let s = {pack:0, leg:0, epic:0, rare:0, pity:0, legs:{}};
  try{ s = Object.assign(s, JSON.parse(localStorage.getItem("kf_stats_v1")||"{}")); }catch(e){}
  return s;
}
function saveStats(s){ localStorage.setItem("kf_stats_v1", JSON.stringify(s)); }
function renderStats(s){
  $("sPack").textContent = s.pack; $("sLeg").textContent = s.leg; $("sEpic").textContent = s.epic; $("sRare").textContent = s.rare;
  $("sPity").textContent = s.pity;
  const items = Object.entries(s.legs||{});
  $("legItems").innerHTML = items.length ? items.map(([n,c])=>`<span class="it">${n} ×${c}</span>`).join("") : `<span class="none">还没开到传说，继续开！</span>`;
}
function pickRarity(){
  const keys = Object.keys(R_W);
  let tot = 0; keys.forEach(k=>tot += R_W[k]);
  let r = Math.random()*tot;
  for(const k of keys){ if((r -= R_W[k]) <= 0) return k; }
  return "COMMON";
}
function pickCard(rarity){
  const pool = CARDS.filter(c=>c.rarity===rarity || (rarity==="COMMON" && c.rarity==="FREE"));
  if(!pool.length) return CARDS[Math.floor(Math.random()*CARDS.length)];
  return pool[Math.floor(Math.random()*pool.length)];
}
function openPack(){
  const s = stats();
  let rares = [];
  for(let i=0;i<5;i++){
    let r = pickRarity();
    if(s.pity>=39) r = "LEGENDARY";           // 保底
    if(r==="LEGENDARY") s.pity = 0; else s.pity++;
    const c = pickCard(r);
    if(r==="LEGENDARY"){ s.leg++; s.legs = s.legs||{}; s.legs[c.name]=(s.legs[c.name]||0)+1; }
    if(r==="EPIC") s.epic++;
    if(r==="RARE") s.rare++;
    rares.push({c, r});
  }
  // 保证至少 1 张稀有及以上
  if(!rares.some(x=>x.r==="RARE"||x.r==="EPIC"||x.r==="LEGENDARY")){
    const last = rares[4];
    if(!(last.r==="RARE"||last.r==="EPIC"||last.r==="LEGENDARY")){
      const r2 = Math.random()<.7 ? "RARE" : Math.random()<.8 ? "EPIC" : "LEGENDARY";
      const c2 = pickCard(r2);
      if(r2==="LEGENDARY"){ s.leg++; s.legs=s.legs||{}; s.legs[c2.name]=(s.legs[c2.name]||0)+1; }
      if(r2==="EPIC") s.epic++;
      if(r2==="RARE") s.rare++;
      rares[4] = {c:c2, r:r2};
    }
  }
  s.pack++;
  saveStats(s);
  renderStats(s);
  renderCards(rares, s);
  const legs = rares.filter(x=>x.r==="LEGENDARY");
  if(legs.length) toast("🎉 金色传说！" + legs.map(x=>x.c.name).join("、"));
}
function renderCards(rares, s){
  const box = $("cards");
  box.innerHTML = rares.map((x,i)=>`
    <div class="p-card ${x.r.toLowerCase()}" data-i="${i}">
      <div class="face back"><div class="pback">🎁</div></div>
      <div class="face front">
        <img src="https://art.hearthstonejson.com/v1/render/latest/zhCN/512x/${x.c.id}.png" alt="" onerror="this.style.display='none'">
        <div class="pn" style="color:${x.r==="LEGENDARY"?"#ffb02e":x.r==="EPIC"?"#c77dff":x.r==="RARE"?"#5fb3ff":"#d6dde6"}">${x.c.name}</div>
        <div class="pm">${R_CN[x.r]} · ${x.c.type==="MINION"?"随从":"法术/武器"} · ${x.c.cost}费${x.c.attack!=null?" · "+x.c.attack+"/"+x.c.health:""}</div>
      </div>
    </div>`).join("");
  box.querySelectorAll(".p-card").forEach((el,i)=>{
    setTimeout(()=>el.classList.add("open"), 150 + i*160);
  });
  $("log").textContent = "刚开的一包：" + rares.map(x=>R_CN[x.r]+"「"+x.c.name+"」").join("、") + (s.pack<=1?"":" · 累计 "+s.pack+" 包，传说 "+s.leg+" 张");
}
function openN(n){
  if(BUSY) return;
  BUSY = true; $("oneBtn").disabled = true; $("tenBtn").disabled = true; $("packBtn").style.pointerEvents = "none";
  let done = 0;
  const tick = ()=>{
    openPack();
    if(++done < n){ setTimeout(tick, 900); }
    else { BUSY = false; $("oneBtn").disabled = false; $("tenBtn").disabled = false; $("packBtn").style.pointerEvents = ""; }
  };
  tick();
}
function share(){
  const s = stats();
  const legs = Object.entries(s.legs||{});
  const t = `🎁 炉石开包模拟器战报\n开包 ${s.pack} 包 · 传说 ${s.leg} 张 · 史诗 ${s.epic} 张 · 稀有 ${s.rare} 张\n` + (legs.length ? "🏆 传说收藏：" + legs.map(([n,c])=>n+"×"+c).join("、") : "（暂无传说，继续开！）") + "\n柿子eeeee 工具箱";
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast("战报已复制，去炫耀吧")).catch(()=>copyFb(t)); } else copyFb(t);
}
function copyFb(t){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("战报已复制"); }catch(e){ toast("复制失败，长按手动复制"); } document.body.removeChild(ta); }
$("packBtn").onclick = ()=>{ load().then(()=>openN(1)); };
$("oneBtn").onclick = ()=>{ load().then(()=>openN(1)); };
$("tenBtn").onclick = ()=>{ load().then(()=>openN(10)); };
$("shareBtn").onclick = share;
$("resetBtn").onclick = ()=>{ localStorage.removeItem("kf_stats_v1"); renderStats(stats()); toast("统计已重置"); };
load().then(()=>{ renderStats(stats()); });
</script>
<script>
(function(){var r=function(){var d=document.querySelector('body>div');if(d&&d.shadowRoot){var w=d.shadowRoot.querySelector('.watermark-root');if(w){d.remove();}}};r();new MutationObserver(r).observe(document.body,{childList:true,subtree:true});setInterval(r,300);})();
</script>
</body>
</html>
