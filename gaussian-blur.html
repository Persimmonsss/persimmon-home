<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高斯模糊图片处理工具</title>
  <link rel="icon" type="image/png" href="icon_persimmon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
        body{background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%);color:#333;min-height:100vh;padding:20px;line-height:1.6;}
        .container{max-width:1200px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);padding:30px;overflow:hidden;}
        header{text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #eee;}
        h1{color:#2575fc;margin-bottom:10px;font-size:2.5rem;}
        .subtitle{color:#666;font-size:1.1rem;}
        .upload-section{display:flex;flex-direction:column;align-items:center;margin-bottom:30px;}
        .upload-area{width:100%;max-width:600px;border:3px dashed #6a11cb;border-radius:10px;padding:40px 20px;text-align:center;cursor:pointer;transition:all 0.3s ease;margin-bottom:20px;background:#f9f9f9;}
        .upload-area:hover{background:#f0f0f0;border-color:#2575fc;}
        .upload-area i{font-size:48px;color:#6a11cb;margin-bottom:15px;}
        .upload-area p{margin:10px 0;font-size:1.1rem;}
        .controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:30px;justify-content:center;align-items:center;}
        .control-group{display:flex;flex-direction:column;flex:1;min-width:200px;}
        label{margin-bottom:8px;font-weight:600;color:#444;}
        input[type="range"]{width:100%;height:8px;border-radius:4px;background:#ddd;outline:none;-webkit-appearance:none;}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#6a11cb;cursor:pointer;}
        .value-display{font-weight:bold;color:#2575fc;font-size:1.2rem;margin-left:10px;}
        button{background:linear-gradient(to right,#6a11cb,#2575fc);color:white;border:none;padding:12px 25px;border-radius:50px;cursor:pointer;font-size:1rem;font-weight:600;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(106,17,203,0.3);margin:5px;}
        button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(106,17,203,0.4);}
        button:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none;}
        .preview-section{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:30px;}
        .image-container{flex:1;min-width:300px;text-align:center;border-radius:10px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .image-container h3{background:#6a11cb;color:white;padding:10px;margin:0;}
        .preview-image{width:100%;height:300px;object-fit:contain;background:#f5f5f5;display:block;}
        .batch-section{margin-top:30px;}
        .batch-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:15px;}
        .batch-item{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.1);}
        .batch-item img{width:100%;height:120px;object-fit:cover;display:block;}
        .batch-item .filename{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:white;padding:5px;font-size:0.8rem;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;}
        .status{text-align:center;padding:15px;margin:20px 0;border-radius:8px;font-weight:600;}
        .status.success{background:#d4edda;color:#155724;}
        .status.error{background:#f8d7da;color:#721c24;}
        .status.info{background:#cce5ff;color:#004085;}
        .download-section{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
        .hidden{display:none;}
        @media (max-width:768px){.container{padding:15px;}h1{font-size:2rem;}.preview-section{flex-direction:column;}.image-container{min-width:100%;}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>高斯模糊图片处理工具</h1>
            <p class="subtitle">支持单个图片、文件夹或批量处理，可调整高斯模糊参数</p>
        </header>
        
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <i>📁</i>
                <p>拖放图片到此处或点击选择文件</p>
                <p>支持单个图片、文件夹或多个图片</p>
                <input type="file" id="fileInput" multiple accept="image/*" style="display:none;">
            </div>
            <button id="processBtn">处理图片</button>
        </section>
        
        <section class="controls">
            <div class="control-group">
                <label for="sigmaSlider">高斯模糊系数 (σ):</label>
                <div style="display:flex;align-items:center;">
                    <input type="range" id="sigmaSlider" min="0" max="20" step="0.5" value="5">
                    <span class="value-display" id="sigmaValue">5</span>
                </div>
            </div>
        </section>
        
        <section class="preview-section">
            <div class="image-container">
                <h3>原图预览</h3>
                <img id="originalPreview" class="preview-image" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'%3E%3Crect fill='%23f5f5f5' width='200' height='150'/%3E%3Ctext fill='%23999' font-family='sans-serif' font-size='14' x='50%25' y='50%25' text-anchor='middle' dominant-baseline='middle'%3E原图预览%3C/text%3E%3C/svg%3E" alt="原图预览">
            </div>
            <div class="image-container">
                <h3>处理后预览 (117×120)</h3>
                <img id="processedPreview" class="preview-image" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'%3E%3Crect fill='%23f5f5f5' width='200' height='150'/%3E%3Ctext fill='%23999' font-family='sans-serif' font-size='14' x='50%25' y='50%25' text-anchor='middle' dominant-baseline='middle'%3E处理后预览%3C/text%3E%3C/svg%3E" alt="处理后预览">
            </div>
        </section>
        
        <section class="batch-section">
            <h2>批量处理图片列表</h2>
            <div id="batchList" class="batch-list"></div>
        </section>
        
        <div id="status" class="status info">请选择要处理的图片</div>
        
        <div id="downloadSection" class="download-section hidden">
            <button id="downloadAllBtn">批量下载所有图片</button>
        </div>
    </div>

    <script>
        const TARGET_WIDTH = 117;
        const TARGET_HEIGHT = 120;
        let currentFiles = [];
        let currentSigma = 5;
        let processedImages = [];
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const sigmaSlider = document.getElementById('sigmaSlider');
        const sigmaValue = document.getElementById('sigmaValue');
        const processBtn = document.getElementById('processBtn');
        const originalPreview = document.getElementById('originalPreview');
        const processedPreview = document.getElementById('processedPreview');
        const batchList = document.getElementById('batchList');
        const status = document.getElementById('status');
        const downloadSection = document.getElementById('downloadSection');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        uploadArea.addEventListener('click',()=>fileInput.click());
        uploadArea.addEventListener('dragover',(e)=>{e.preventDefault();uploadArea.style.background='#f0f0f0';uploadArea.style.borderColor='#2575fc';});
        uploadArea.addEventListener('dragleave',()=>{uploadArea.style.background='#f9f9f9';uploadArea.style.borderColor='#6a11cb';});
        uploadArea.addEventListener('drop',handleDrop);
        fileInput.addEventListener('change',handleFileSelect);
        sigmaSlider.addEventListener('input',updateSigma);
        processBtn.addEventListener('click',processImages);
        downloadAllBtn.addEventListener('click',downloadAllImages);
        function updateSigma(){
            currentSigma=parseFloat(sigmaSlider.value);
            sigmaValue.textContent=currentSigma;
            if(currentFiles.length>0){previewImage(currentFiles[0]);}
        }
        function handleDrop(e){
            e.preventDefault();
            uploadArea.style.background='#f9f9f9';
            uploadArea.style.borderColor='#6a11cb';
            const files=Array.from(e.dataTransfer.files).filter(file=>file.type.startsWith('image/'));
            if(files.length>0){handleFiles(files);}else{showStatus('请选择图片文件','error');}
        }
        function handleFileSelect(e){
            const files=Array.from(e.target.files).filter(file=>file.type.startsWith('image/'));
            if(files.length>0){handleFiles(files);}else{showStatus('请选择图片文件','error');}
        }
        function handleFiles(files){
            currentFiles=files;
            processedImages=[];
            updateBatchList();
            downloadSection.classList.add('hidden');
            if(files.length>0){
                previewImage(files[0]);
                showStatus(`已选择 ${files.length} 个图片文件`,'success');
            }
        }
        function updateBatchList(){
            batchList.innerHTML='';
            currentFiles.forEach((file,index)=>{
                const item=document.createElement('div');
                item.className='batch-item';
                const img=document.createElement('img');
                img.src=URL.createObjectURL(file);
                img.alt=file.name;
                const filename=document.createElement('div');
                filename.className='filename';
                filename.textContent=file.name;
                item.appendChild(img);
                item.appendChild(filename);
                batchList.appendChild(item);
            });
        }
        function previewImage(file){
            const reader=new FileReader();
            reader.onload=function(e){
                originalPreview.src=e.target.result;
                const img=new Image();
                img.onload=function(){
                    const canvas=document.createElement('canvas');
                    canvas.width=TARGET_WIDTH;
                    canvas.height=TARGET_HEIGHT;
                    const ctx=canvas.getContext('2d');
                    ctx.filter=`blur(${currentSigma}px)`;
                    ctx.drawImage(img,0,0,TARGET_WIDTH,TARGET_HEIGHT);
                    processedPreview.src=canvas.toDataURL('image/png');
                };
                img.src=e.target.result;
            };
            reader.readAsDataURL(file);
        }
        function processSingleImage(file){
            return new Promise(resolve=>{
                const img=new Image();
                const reader=new FileReader();
                reader.onload=e=>{img.src=e.target.result;};
                img.onload=()=>{
                    const canvas=document.createElement('canvas');
                    canvas.width=TARGET_WIDTH;
                    canvas.height=TARGET_HEIGHT;
                    const ctx=canvas.getContext('2d');
                    ctx.filter=`blur(${currentSigma}px)`;
                    ctx.drawImage(img,0,0,TARGET_WIDTH,TARGET_HEIGHT);
                    canvas.toBlob(blob=>{resolve(blob);},'image/png');
                };
                reader.readAsDataURL(file);
            });
        }
        function processImages(){
            if(currentFiles.length===0){showStatus('请先选择图片','error');return;}
            showStatus('正在处理图片...','info');
            processBtn.disabled=true;
            status.innerHTML='';
            processedImages=[];
            const processPromises=currentFiles.map((file,index)=>{
                return new Promise((resolve)=>{
                    processSingleImage(file).then(blob=>{
                        processedImages.push({name:file.name,blob:blob});
                        const link=document.createElement('a');
                        link.download=file.name;
                        link.href=URL.createObjectURL(blob);
                        link.textContent=`下载 ${file.name}`;
                        link.className='download-link';
                        link.style.display='block';
                        link.style.margin='10px 0';
                        link.style.padding='8px 15px';
                        link.style.background='#6a11cb';
                        link.style.color='white';
                        link.style.borderRadius='4px';
                        link.style.textDecoration='none';
                        status.appendChild(link);
                        resolve();
                    });
                });
            });
            Promise.all(processPromises).then(()=>{
                showStatus(`已处理 ${currentFiles.length} 个图片，点击下方链接下载`,'success');
                processBtn.disabled=false;
                downloadSection.classList.remove('hidden');
            });
        }
        function downloadAllImages(){
            if(processedImages.length===0){showStatus('没有可下载的图片','error');return;}
            showStatus('正在打包图片...','info');
            const zip=new JSZip();
            const folder=zip.folder("processed_images");
            processedImages.forEach((image)=>{folder.file(image.name,image.blob);});
            zip.generateAsync({type:"blob"}).then(function(content){
                saveAs(content,"processed_images.zip");
                showStatus('批量下载完成！','success');
            });
        }
        function showStatus(message,type){
            const statusElement=document.getElementById('status');
            statusElement.textContent=message;
            statusElement.className=`status ${type}`;
        }
    </script>
<script>
/* 移除平台右下角水印角标（shadow DOM .watermark-root，直接移除节点，防重注入轮询） */
(function(){
  function killBadge(){
    try{
      var list = document.querySelectorAll('body > div');
      for(var i=0;i<list.length;i++){
        var d = list[i];
        if(d.shadowRoot && d.shadowRoot.querySelector('.watermark-root')){
          if(d.parentNode) d.parentNode.removeChild(d);
        }
      }
    }catch(e){}
  }
  killBadge();
  new MutationObserver(killBadge).observe(document.body,{childList:true});
  setInterval(killBadge, 300);
})();
</script>
</body>
</html>
