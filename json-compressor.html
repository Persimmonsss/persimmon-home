<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 压缩器 - 柿子eeeee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --persimmon: #ff6b35;
      --persimmon-light: #ff9a56;
      --cream: #fff5ed;
      --dark: #2d1b0f;
      --gray: #8c8079;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      padding: 80px 20px 40px;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 245, 237, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      padding: 14px 0;
      box-shadow: 0 1px 0 rgba(255, 107, 53, 0.1);
    }
    nav .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    nav .brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--persimmon);
      text-decoration: none;
    }
    nav .back {
      color: var(--dark);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    nav .back:hover { color: var(--persimmon); }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      color: var(--persimmon);
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--gray);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }
    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(255, 107, 53, 0.12);
      margin-bottom: 20px;
    }
    .panel label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .panel label .size {
      color: var(--gray);
      font-weight: 400;
      font-size: 0.8rem;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      border: 2px solid #f0e0d0;
      border-radius: 10px;
      padding: 14px;
      font-family: "Consolas", "Monaco", monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      background: #fefcf9;
    }
    textarea:focus { border-color: var(--persimmon); }
    textarea::placeholder { color: #ccc; }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-compress {
      background: var(--persimmon);
      color: #fff;
    }
    .btn-compress:hover {
      background: #e55a2b;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
    }
    .btn-clear {
      background: transparent;
      border: 2px solid #ddd;
      color: var(--gray);
    }
    .btn-clear:hover { border-color: var(--persimmon); color: var(--persimmon); }
    .btn-copy {
      background: transparent;
      border: 2px solid var(--persimmon);
      color: var(--persimmon);
    }
    .btn-copy:hover { background: var(--persimmon); color: #fff; }
    .result-wrap { display: none; }
    .result-wrap.show { display: block; }
    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--cream);
      border-radius: 10px;
      padding: 12px 20px;
      text-align: center;
    }
    .stat .num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--persimmon);
    }
    .stat .label {
      font-size: 0.75rem;
      color: var(--gray);
    }
    .error {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc3333;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .error.show { display: block; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--persimmon);
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 600px) {
      body { padding: 70px 12px 20px; }
      h1 { font-size: 1.4rem; }
      .actions { flex-direction: column; align-items: center; }
      button { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="brand">🍅 柿子eeeee</a>
      <a href="index.html#toolbox" class="back">← 返回工具箱</a>
    </div>
  </nav>

  <div class="container">
    <h1>JSON 压缩器</h1>
    <p class="subtitle">把多行 JSON 压缩成一行，减小体积</p>

    <div class="error" id="error"></div>

    <div class="panel">
      <label>
        <span>输入 JSON</span>
        <span class="size" id="inputSize">0 字符</span>
      </label>
      <textarea id="input" placeholder='粘贴你的 JSON 这里，例如：&#10;{&#10;  "name": "柿子",&#10;  "type": "fruit"&#10;}'></textarea>
    </div>

    <div class="actions">
      <button class="btn-compress" onclick="compress()">压缩</button>
      <button class="btn-clear" onclick="clearAll()">清空</button>
    </div>

    <div class="result-wrap" id="resultWrap">
      <div class="stats">
        <div class="stat">
          <div class="num" id="beforeSize">0</div>
          <div class="label">压缩前</div>
        </div>
        <div class="stat">
          <div class="num" id="afterSize">0</div>
          <div class="label">压缩后</div>
        </div>
        <div class="stat">
          <div class="num" id="savedPercent">0%</div>
          <div class="label">节省</div>
        </div>
      </div>

      <div class="panel">
        <label>
          <span>输出结果</span>
          <span class="size" id="outputSize">0 字符</span>
        </label>
        <textarea id="output" readonly></textarea>
      </div>

      <div class="actions">
        <button class="btn-copy" onclick="copyResult()">复制结果</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const error = document.getElementById('error');
    const resultWrap = document.getElementById('resultWrap');
    const inputSize = document.getElementById('inputSize');

    input.addEventListener('input', function() {
      inputSize.textContent = input.value.length + ' 字符';
    });

    function compress() {
      const text = input.value.trim();
      if (!text) {
        showError('请输入 JSON 内容');
        return;
      }

      try {
        const data = JSON.parse(text);
        const compressed = JSON.stringify(data);
        const originalLength = text.length;
        const compressedLength = compressed.length;
        const saved = Math.round((1 - compressedLength / originalLength) * 100);

        output.value = compressed;
        document.getElementById('beforeSize').textContent = originalLength;
        document.getElementById('afterSize').textContent = compressedLength;
        document.getElementById('savedPercent').textContent = saved + '%';
        document.getElementById('outputSize').textContent = compressedLength + ' 字符';

        error.classList.remove('show');
        resultWrap.classList.add('show');
      } catch (e) {
        showError('JSON 格式错误: ' + e.message);
        resultWrap.classList.remove('show');
      }
    }

    function showError(msg) {
      error.textContent = msg;
      error.classList.add('show');
      resultWrap.classList.remove('show');
    }

    function clearAll() {
      input.value = '';
      output.value = '';
      inputSize.textContent = '0 字符';
      error.classList.remove('show');
      resultWrap.classList.remove('show');
    }

    function copyResult() {
      output.select();
      document.execCommand('copy');
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }
  </script>

<script>
/* 移除平台右下角水印角标（shadow DOM .watermark-root，直接移除节点，防重注入轮询） */
(function(){
  function killBadge(){
    try{
      var list = document.querySelectorAll('body > div');
      for(var i=0;i<list.length;i++){
        var d = list[i];
        if(d.shadowRoot && d.shadowRoot.querySelector('.watermark-root')){
          if(d.parentNode) d.parentNode.removeChild(d);
        }
      }
    }catch(e){}
  }
  killBadge();
  new MutationObserver(killBadge).observe(document.body,{childList:true});
  setInterval(killBadge, 300);
})();
</script>
</body>
</html>
