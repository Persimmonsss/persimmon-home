<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者荣耀 猜英雄 - 柿子工具箱</title>
<link rel="icon" type="image/png" href="icon_persimmon.png">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1526; --card:#141c30; --card2:#1a2440;
  --gold:#c8aa6e; --gold2:#a9873f; --wzred:#e5534b; --wzblue:#4da3ff;
  --text:#e8e6e3; --muted:#8a93a8; --ok:#3fb950; --warn:#d29922; --bad:#e5534b;
  --cell-ok:#1b5e20; --cell-part:#7a4d0d; --cell-bad:#6b1f1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
button{font-family:inherit;}
body{background:radial-gradient(1200px 600px at 20% -10%, #16203a 0%, var(--bg) 55%);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
a{color:var(--gold);text-decoration:none;}
.wrap{max-width:980px;margin:0 auto;padding:16px;}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4da3ff,#7b5cff);display:flex;align-items:center;justify-content:center;font-size:18px;}
.streak{background:var(--card);border:1px solid #223;border-radius:12px;padding:6px 14px;font-size:14px;color:var(--muted);}
.streak b{color:var(--gold);font-size:18px;margin-left:4px;}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px;}
.tab{flex:1;min-width:100px;padding:10px 8px;border-radius:12px;background:var(--card);border:1px solid #22314d;color:var(--muted);cursor:pointer;text-align:center;font-size:13px;transition:.15s;user-select:none;}
.tab:hover{border-color:var(--gold);color:var(--text);}
.tab.active{background:linear-gradient(135deg,#1c2a4a,#14203a);border-color:var(--gold);color:var(--gold);font-weight:600;}
.tab .ic{display:block;font-size:18px;margin-bottom:2px;}
/* card */
.card{background:var(--card);border:1px solid #22314d;border-radius:16px;padding:20px;margin-bottom:16px;position:relative;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.7;}
.qnum{color:var(--muted);font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.qnum .hint-left{color:var(--gold);}
.qnum .actions{display:flex;gap:8px;align-items:center;}
/* 图例 */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 16px;padding:10px 12px;background:var(--bg2);border:1px solid #22314d;border-radius:10px;font-size:12px;color:var(--muted);}
.legend .lg{display:inline-flex;align-items:center;gap:5px;}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;}
.sw-ok{background:var(--cell-ok);} .sw-part{background:var(--cell-part);} .sw-bad{background:var(--cell-bad);}
/* 输入 */
.guess-row{display:flex;gap:10px;margin-top:14px;position:relative;}
.guess-input-wrap{position:relative;flex:1;}
#guessInput{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid #2a3a5e;color:var(--text);font-size:15px;outline:none;transition:.15s;}
#guessInput:focus{border-color:var(--gold);}
.btn{padding:12px 22px;border-radius:12px;border:1px solid #2a3a5e;background:var(--card2);color:var(--text);cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap;}
.btn:hover{border-color:var(--gold);}
.btn-gold{background:linear-gradient(135deg,#c8aa6e,#a9873f);border:none;color:#0a0e1a;font-weight:700;}
.btn-gold:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--gold);border-color:var(--gold);}
/* 下拉匹配 */
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#0d1626;border:1px solid #2a3a5e;border-radius:12px;max-height:300px;overflow-y:auto;z-index:100;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5);}
.suggest.show{display:block;}
.sug-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #16213a;}
.sug-item:last-child{border-bottom:none;}
.sug-item:hover,.sug-item.sel{background:#1c2a4a;}
.sug-item img{width:34px;height:34px;border-radius:8px;background:#000;object-fit:cover;}
.sug-item .nm{font-size:14px;font-weight:600;}
.sug-item .tt{font-size:12px;color:var(--muted);margin-left:6px;}
/* 对比表（经典） */
.tbl-wrap{overflow-x:auto;margin-top:16px;border-radius:10px;border:1px solid #22314d;}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
table.cmp th{background:#0d1626;color:var(--muted);padding:8px 10px;font-weight:600;text-align:left;border-bottom:1px solid #22314d;white-space:nowrap;}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;z-index:2;background:#0d1626;}
table.cmp td{padding:8px 10px;border-bottom:1px solid #16213a;white-space:nowrap;}
table.cmp tr:last-child td{border-bottom:none;}
table.cmp td.cell-ok{background:var(--cell-ok);color:#d7ffe3;font-weight:600;}
table.cmp td.cell-part{background:var(--cell-part);color:#ffe8b3;font-weight:600;}
table.cmp td.cell-bad{background:var(--cell-bad);color:#ffd6d3;}
td.hero-cell{display:flex;align-items:center;gap:8px;background:#0d1626;color:var(--text);font-weight:600;}
td.hero-cell img{width:32px;height:32px;border-radius:6px;background:#000;object-fit:cover;}
td .arr{font-size:12px;margin-left:2px;}
/* 题面 */
.qarea{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px;background:var(--bg2);border:1px dashed #2a3a5e;border-radius:12px;padding:20px;text-align:center;}
.qarea #qbody{width:100%;}
.splash-box{width:100%;height:230px;border-radius:10px;overflow:hidden;position:relative;background:#000;}
.splash-box img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.splash-box.imgfail::after{content:"图片加载失败，请检查网络后重试";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
.icon-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.icon-row .ab{width:82px;height:86px;border-radius:12px;background:#0d1626;border:1px solid #2a3a5e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);}
.icon-row .ab img{width:54px;height:54px;border-radius:8px;object-fit:cover;}
.icon-row .ab.off{opacity:.4;cursor:not-allowed;}
.qz-q{font-size:17px;font-weight:600;line-height:1.7;max-width:640px;margin-bottom:4px;}
.ask-wrap{display:flex;flex-direction:column;gap:12px;}
.ask-input-row{display:flex;gap:8px;}
.ask-input-row input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border .2s;}
.ask-input-row input:focus{border-color:var(--gold);}
.ask-chips{display:flex;flex-wrap:wrap;gap:7px;max-height:170px;overflow-y:auto;padding-right:2px;}
.ask-chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;transition:all .2s;text-align:left;}
.ask-chip:hover{border-color:var(--gold);color:#f3e2c7;}
.ask-chip.done{opacity:.38;text-decoration:line-through;pointer-events:none;}
.ask-log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.ask-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;animation:feedIn .25s ease;}
.ask-row .aq{color:var(--text);flex:1;}
.ask-row .aa{font-weight:700;flex-shrink:0;}
.ask-row.yes .aa{color:#7ed18c;}
.ask-row.no .aa{color:#e58a7a;}
.ask-remain{font-size:13px;color:var(--gold);font-weight:700;}
.qz-note{font-size:13px;color:var(--muted);margin-top:8px;max-width:640px;}
.hint-text{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.7;}
.big-text{font-size:26px;font-weight:700;line-height:1.6;color:var(--text);letter-spacing:2px;}
.big-text .qt{color:var(--gold);}
/* 选项（问答） */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;margin:14px auto 0;}
.opt-btn{padding:14px 16px;border-radius:12px;background:var(--card2);border:1px solid #2a3a5e;color:var(--text);font-size:15px;cursor:pointer;transition:.15s;font-weight:600;text-align:center;}
.opt-btn:hover{border-color:var(--gold);color:var(--gold);}
.opt-btn.ok{background:var(--cell-ok);border-color:var(--ok);color:#d7ffe3;}
.opt-btn.bad{background:var(--cell-bad);border-color:var(--bad);color:#ffd6d3;}
.opt-btn.dis{opacity:.4;cursor:not-allowed;}
/* feed */
.feed{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.feed .row{padding:10px 14px;border-radius:10px;font-size:14px;}
.feed .row.ok{background:rgba(63,185,80,.12);border:1px solid var(--cell-ok);color:#a7f3bd;}
.feed .row.bad{background:rgba(229,83,75,.12);border:1px solid var(--cell-bad);color:#fecaca;}
.feed .row.info{background:rgba(210,153,34,.12);border:1px solid var(--cell-part);color:#fde68a;}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(4,8,16,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-mask.show{display:flex;}
.modal{background:linear-gradient(160deg,#16203a,#0d1428);border:1px solid var(--gold);border-radius:20px;max-width:420px;width:100%;padding:26px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.7);max-height:90vh;overflow-y:auto;}
.modal .m-hero{width:96px;height:96px;border-radius:14px;object-fit:cover;border:2px solid var(--gold);background:#000;}
.modal h2{color:var(--gold);font-size:26px;margin:12px 0 4px;}
.modal .m-name{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal .m-tries{color:var(--muted);font-size:14px;margin:10px 0;}
.modal .m-stats{background:var(--bg2);border-radius:12px;padding:12px;margin:12px 0;text-align:left;}
.modal .m-stats h3{font-size:13px;color:var(--muted);margin-bottom:8px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;color:var(--muted);}
.bar-row .bar{flex:1;height:16px;background:#0d1626;border-radius:4px;overflow:hidden;position:relative;}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;}
.bar-row .n{width:14px;text-align:right;}
.modal .m-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.modal .m-share{background:var(--bg2);border:1px solid #2a3a5e;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--muted);word-break:break-all;text-align:left;max-height:110px;overflow-y:auto;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c2a4a;border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:12px;font-size:14px;z-index:200;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.toast.show{display:block;animation:toastin .25s;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
@media (max-width:640px){
  .tabs{gap:6px;}
  .tab{min-width:70px;font-size:12px;padding:8px 4px;}
  .modal{max-width:96%;padding:20px;}
  .opts{grid-template-columns:1fr;}
  .big-text{font-size:22px;}
}
/* ===== 丝滑动效 ===== */
.card,.btn,.tab,.sug-item,.opt-btn{transition:all .22s ease;}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35);}
.btn:active{transform:scale(.95);}
@keyframes feedIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
#feed .row{animation:feedIn .32s ease both;}
@keyframes modalPop{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-mask .modal{animation:modalPop .3s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes rowFlash{0%{background:rgba(200,168,110,.30);}100%{background:transparent;}}
.cmp tbody tr:first-child{animation:rowFlash 1.4s ease .25s both;}
@keyframes streakPop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
#streakNum{display:inline-block;}
.streak-pop{animation:streakPop .45s ease;}
.splash-box,.splash-box img{transition:transform .55s cubic-bezier(.25,.8,.3,1);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.toast{animation:toastIn .25s ease both;}
html{scroll-behavior:smooth;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="dot">🛡️</div>王者荣耀 猜英雄</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="streak">连胜 <b id="streakNum">0</b></div>
      <button class="btn btn-ghost" id="topShareBtn" style="padding:5px 10px;font-size:12px;">📤 分享</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="classic"><span class="ic">⚔️</span>经典</div>
    <div class="tab" data-mode="title"><span class="ic">🏷</span>称号</div>
    <div class="tab" data-mode="skill"><span class="ic">🧩</span>技能</div>
    <div class="tab" data-mode="splash"><span class="ic">🖼</span>原画</div>
    <div class="tab" data-mode="skin"><span class="ic">✨</span>皮肤</div>
    <div class="tab" data-mode="quote"><span class="ic">🎤</span>台词</div>
    <div class="tab" data-mode="quiz"><span class="ic">🧠</span>问答</div>
    <div class="tab" data-mode="ask"><span class="ic">❓</span>提问猜英雄</div>
  </div>
  <div class="card">
    <div class="qnum">
      <span class="mode-title" id="modeTitle">经典模式</span>
      <span class="actions">
        <span class="hint-left" id="hintLeft"></span>
        <button class="btn btn-ghost" id="hintBtn" style="padding:6px 12px;font-size:13px;">💡 提示</button>
      </span>
    </div>
    <div class="legend" id="legend" style="display:none;">
      <span class="lg"><span class="sw sw-ok"></span>正确</span>
      <span class="lg"><span class="sw sw-part"></span>部分正确</span>
      <span class="lg"><span class="sw sw-bad"></span>错误</span>
      <span class="lg"><span class="sw sw-bad"></span>⬇ 更低</span>
      <span class="lg"><span class="sw sw-bad"></span>⬆ 更高</span>
    </div>
    <div class="qarea" id="qarea"><div id="qbody"></div></div>
    <div class="guess-row">
      <div class="guess-input-wrap">
        <input id="guessInput" placeholder="输入英雄名字（支持中文 / 拼音 / 外号）" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <button class="btn btn-gold" id="guessBtn">猜！</button>
      <button class="btn btn-ghost" id="skipBtn">跳过</button>
    </div>
    <div class="feed" id="feed"></div>
    <div class="tbl-wrap" id="tblWrap" style="display:none;"></div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:12px;padding:10px 0;">
    数据来源：王者荣耀官网公开数据 · 粉丝自制，与腾讯游戏无关 ·
    <a href="index.html">← 返回工具箱</a>
  </div>
</div>

<!-- 分享面板 -->
<div class="modal-mask" id="shareModal">
  <div class="modal" style="max-width:380px;text-align:center;">
    <h2 style="margin:0 0 6px;">分享给朋友</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:12px;">朋友扫二维码或点链接，立刻开玩</div>
    <div id="shareQr" style="display:inline-block;background:#fff;padding:8px;border-radius:10px;margin-bottom:12px;"></div>
    <div class="m-share" id="shareModalText" style="max-height:70px;"></div>
    <div class="m-actions" style="flex-direction:column;gap:8px;margin-top:12px;">
      <button class="btn btn-gold" id="shareCopyBtn" style="width:100%;">📋 复制文案</button>
      <button class="btn btn-ghost" id="shareSysBtn" style="width:100%;">📤 系统分享</button>
      <button class="btn btn-ghost" id="shareCloseBtn" style="width:100%;">关闭</button>
    </div>
  </div>
</div>

<!-- 胜利弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <img class="m-hero" id="mHero" alt="">
    <h2>胜利！</h2>
    <div class="m-name" id="mName"></div>
    <div class="m-tries" id="mTries"></div>
    <div class="m-stats">
      <h3 id="mStatsTitle">统计数据</h3>
      <div id="mStats"></div>
    </div>
    <div class="m-actions">
      <button class="btn btn-gold" id="mAgain">再来一题</button>
      <button class="btn" id="mCopy">📋 复制结果</button>
      <button class="btn btn-ghost" id="mShareBtn">📤 分享到微信</button>
    </div>
    <div class="m-share" id="mShare"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 常量与映射 ===================== */
const MODE_NAMES = {classic:"经典模式", title:"称号模式", skill:"技能模式", splash:"原画模式", skin:"皮肤模式", quote:"台词模式", quiz:"知识问答", ask:"提问猜英雄"};
const $ = id=>document.getElementById(id);
let HEROES = [], state = {};
const STAT_KEY = "wzry_guess_stats_v1";
function loadStats(){
  try{ return Object.assign({streak:0,maxStreak:0,total:0,won:0,bestTries:{},modeWins:{},heroes:{}}, JSON.parse(localStorage.getItem(STAT_KEY)) || {}); }
  catch(e){ return {streak:0,maxStreak:0,total:0,won:0,bestTries:{},modeWins:{},heroes:{}}; }
}
function saveStats(s){ try{ localStorage.setItem(STAT_KEY, JSON.stringify(s)); }catch(e){} }
function setStreak(n){
  const el = $("streakNum");
  el.textContent = n;
  el.classList.remove("streak-pop");
  void el.offsetWidth;
  el.classList.add("streak-pop");

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function heroByCn(name){ return HEROES.find(h=>h.cn===name); }
function guessCandidates(q){
  if(!q) return [];
  const low = q.toLowerCase().replace(/\s/g,"");
  const alias = ALIAS[q.trim()] || ALIAS[low];
  let out = (state.mode==="ask" ? (state.askCands||HEROES) : HEROES).filter(h=> h.cn.indexOf(q.trim())>=0 || (h.keywords||"").toLowerCase().indexOf(low)>=0);
  if(alias){
    const h = heroByCn(alias);
    if(h && !out.includes(h)) out.unshift(h);
  }
  return out.slice(0,8);
}
function toast(msg){

function cmpEqual(a,b){ return a===b ? "ok" : "bad"; }
function cmpLanes(g,a){
  if(!a.length) return "bad";
  if(g.length===a.length && g.every(x=>a.includes(x))) return "ok";
  if(g.some(x=>a.includes(x))) return "part";
  return "bad";
}
function cmpNum(g,a){ if(g===a) return "ok"; return g>a ? "low" : "high"; }

}
function cmpYear(g,a){ if(!g||!a) return "bad"; if(g===a) return "ok"; return g>a ? "low" : "high"; }
function cmpRow(h){
  const a = state.hero, g = h;
  const cells = [
    cmpEqual(g.class, a.class),
    cmpLanes(g.lanes, a.lanes),
    cmpEqual(g.gender, a.gender),
    cmpNum(g.skins, a.skins),
    cmpYear(g.year, a.year),
  ];
  const val = [g.class, g.lanes.join(" / "), g.gender, String(g.skins), g.year ? String(g.year) : "—"];
  return {cells, val};
}
function slowScroll(el, target, ms){
  const start = el.scrollLeft, diff = target - start, t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - p, 3);
    el.scrollLeft = start + diff * e;
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function addCmpRow(h){
  const wrap = $("tblWrap");
  wrap.style.display = "block";
  const c = cmpRow(h);
  const arrMark = {ok:"", low:"<span class='arr'>↓</span>", high:"<span class='arr'>↑</span>"};
  let t = wrap.innerHTML;
  const isNew = !t;
  if(isNew){
    t = `<table class="cmp"><thead><tr><th style="width:24%">英雄</th><th style="width:16%">职业</th><th style="width:20%">分路</th><th style="width:12%">性别</th><th style="width:14%">皮肤数</th><th style="width:14%">上线年份</th></tr></thead><tbody>`;
    requestAnimationFrame(()=>{
      if(wrap.scrollWidth > wrap.clientWidth + 4){
        slowScroll(wrap, wrap.scrollWidth, 700);
        setTimeout(()=>{ slowScroll(wrap, 0, 700); }, 1500);
      }
    });
  } else {
    t = t.replace("</tbody></table>", "");
  }
  const row = heroCell(h) + c.val.map((v,i)=>{
    const cl = c.cells[i]==="ok" ? "cell-ok" : c.cells[i]==="part" ? "cell-part" : "cell-bad";
    let mark = "";
    if((i===3 || i===4) && arrMark[c.cells[i]]) mark = arrMark[c.cells[i]];
    return `<td class="${cl}">${v}${mark}</td>`;
  }).join("");
  t = t.replace("<tbody>", "<tbody>" + row);
  t += "</tbody></table>";
  wrap.innerHTML = t;
}

function parseCond(sub){
  let neg = false, t = sub;

        if(/之后|以后|后|晚于/.test(t)) return {label:"在 " + y + " 年之后上线", test:h=>h.year>=y, neg};

      if(/老|元老|早期|开服/.test(t)) return {label:"是老英雄（2016 年前）", test:h=>h.year<=2016, neg};
      if(/新|近期|刚出|最新/.test(t)) return {label:"是新英雄（2019 年后）", test:h=>h.year>=2019, neg};
      continue;
    }
    if(f.type==="num"){
      if(/多|不少|很多/.test(t)) return {label:"皮肤不少（≥5 款）", test:h=>h.skins>=5, neg};
      if(/少|没几个/.test(t)) return {label:"皮肤不多（≤2 款）", test:h=>h.skins<=2, neg};
      const m = t.match(/\d+/);
      if(m){ const n = +m[0]; return {label:"有 " + n + " 款皮肤", test:h=>h.skins===n, neg}; }
      continue;
    }
    for(const v of f.values){
      for(const k of v.kw){
        if(t.includes(k)) return {label:v.label, test:factTest(f, v.v), neg};
      }
    }
  }
  return null;
}
function askOpen(s){
  for(const o of OPENS){
    if(o.re.test(s)) return o;
  }
  return null;
}
function parseAsk(raw){
  const s = askNorm(raw);
  if(/还是/.test(s) && !/不是/.test(s)){ return {hint:"有选择的问题先分开问吧，比如：是法师吗？"}; }
  if(/^(你好|您好|在吗|hi|hello|嗨|嗨喽|哈喽|喂|哈罗)/.test(s) || s==="在") return {talk:"在的！问我关于英雄的问题吧，比如：是法师吗？"};
  if(/是英雄吗|是不是英雄|谁是英雄/.test(s)) return {talk:"TA 当然是一位英雄啦，快用问题缩小范围猜出 TA"};
  if(/不知道|随便|算了|跳过提问|直接猜/.test(s)) return {talk:"那就直接猜吧，输入英雄名字点「猜！」"};
  const op = askOpen(s);
  if(op) return {open:op, raw};
  const subs = s.split(/并且|而且|还|又|也|同时|以及|跟|与|还有|外加/).filter(x=>x);
  const conds = [];
  for(const sub of subs){
    const c = parseCond(sub);
    if(!c) return {sug: sub};
    conds.push(c);
  }
  if(!conds.length) return {sug: s};
  return {conds, raw};
}
function doAsk(q){
  const label = q.label;
  if(state.askAsked[label]){ toast("这个问题问过啦"); return; }
  state.askAsked[label] = true;
  state.askCount++;
  const base = q.test(state.hero);
  const ans = q.neg ? !base : base;
  state.askCands = state.askCands.filter(h=>{ const b = q.test(h); return (q.neg ? !b : b) === ans; });
  pushAskLog(label, ans);
  afterAsk();
}
function doAskOpen(o, raw){
  const h = state.hero;
  const v = o.get(h);
  const first = Array.isArray(v) ? v[0] : v;
  const label = raw || ("TA 的" + o.label);
  if(state.askAsked[label]){ toast("这个问题问过啦"); return; }
  state.askAsked[label] = true;
  state.askCount++;
  const note = o.disp(first);
  state.askCands = state.askCands.filter(x=>{ const xv = o.get(x); return Array.isArray(xv) ? xv.includes(first) : xv === first; });
  pushAskLog(label, true, note);
  afterAsk();
}
function afterAsk(){
  renderAskChips();
  renderAskLog();
  const ar = $("askRemain");
  ar.textContent = `候选英雄：${state.askCands.length} 位` + (state.askCands.length<=5 ? " · 范围很小，快猜！" : "");
  if(state.askCands.length<=3) toast("只剩 " + state.askCands.length + " 位候选了，直接猜吧！");
}
function askByInput(){
  const raw = $("askInput").value.trim();
  if(!raw){ toast("输入一个问题，比如：是法师吗"); return; }
  const r = parseAsk(raw);
  if(r.talk){ toast(r.talk); return; }
  if(r.hint){ toast(r.hint); return; }
  if(r.open){ doAskOpen(r.open, raw); $("askInput").value = ""; return; }
  if(r.sug){ toast("没太听懂～试试问：是法师吗 / 主要打野吗 / 是女性吗，或点下面的预设问题"); return; }
  doAsk({label:r.raw, test:h=>r.conds.every(c=>{ const b = c.test(h); return c.neg ? !b : b; }), neg:false});
  $("askInput").value = "";
}
function pushAskLog(q, ans, note){ if(!state.askLog) state.askLog = []; state.askLog.push({q, ans, note}); }
function renderAskChips(){
  const box = $("askChips"); if(!box) return;
  box.innerHTML = ASK_Q.map((q,i)=>`<button class="ask-chip ${state.askAsked[q.l]?"done":""}" data-i="${i}">${q.l}</button>`).join("");
  box.querySelectorAll(".ask-chip").forEach(b=>{
    b.onclick = ()=>{
      if(b.classList.contains("done")){ toast("这个问题问过啦"); return; }
      doAsk({label:ASK_Q[+b.dataset.i].l, test:ASK_Q[+b.dataset.i].t, neg:false});
    };
  });
}
function renderAskLog(){
  const box = $("askLog"); if(!box) return;
  box.innerHTML = (state.askLog||[]).map((r,i)=>`<div class="ask-row ${r.ans?"yes":"no"}"><span class="aq">Q${i+1}：${r.q}</span><span class="aa">${r.note ? r.note : (r.ans?"✅ 是":"❌ 不是")}</span></div>`).join("");
}
/* ===================== 提示 ===================== */
function hintPool(h){
  const p = [];
  p.push(`TA 的职业是「${h.class}」`);
  p.push(`TA 的分路是 ${h.lanes.join("、")}`);
  p.push(`TA 是${h.gender==="自定义"?"性别可自定义的":(h.gender+"性")}英雄`);
  p.push(`TA 有 ${h.skins} 款皮肤`);
  p.push(`TA 于 ${h.year} 年上线`);
  if(h._rank) p.push(`TA 是第 ${h._rank} 位登录峡谷的英雄`);
  if(h._classCnt) p.push(`和 TA 同职业的英雄有 ${h._classCnt} 位`);
  return p;
}
function hint(){
  if(state.mode==="quiz"){ toast("问答模式没有提示，再想想吧"); return; }
  const pool = hintPool(state.hero);
  if(state.usedHints >= state.maxTries || state.usedHints >= pool.length){
    toast("提示用完了，没有更多线索了"); return;
  }
  if(!state.hintOrder || state.hintOrder.length !== pool.length){
    state.hintOrder = shuffle(pool.map((_,i)=>i));
  }
  const msg = pool[state.hintOrder[state.usedHints]];
  state.usedHints++;
  $("feed").insertAdjacentHTML("afterbegin", `<div class="row info">💡 提示：${msg}</div>`);
  renderHintText();
}

/* ===================== 下拉匹配 ===================== */
let sugSel = -1, sugItems = [];
function showSuggest(){
  const v = $("guessInput").value.trim();
  const box = $("suggest");
  if(!v || state.mode==="quiz"){ box.classList.remove("show"); return; }
  sugItems = guessCandidates(v);
  if(!sugItems.length){ box.classList.remove("show"); return; }
  sugSel = -1;
  box.innerHTML = sugItems.map((h,i)=>`<div class="sug-item${i===sugSel?" sel":""}" data-i="${i}"><img src="${h.head}" alt="" onerror="this.style.visibility='hidden'"><span class="nm">${h.cn}</span><span class="tt">${h.title}</span></div>`).join("");
  box.classList.add("show");
  box.querySelectorAll(".sug-item").forEach(it=>{
    it.onclick = ()=>{
      $("guessInput").value = sugItems[parseInt(it.dataset.i,10)].cn;
      box.classList.remove("show");
      doGuess();
    };
  });
}
/* ===================== 猜测 ===================== */
function doGuess(){
  const v = $("guessInput").value.trim();
  if(!v){ toast("先输入一个英雄名吧"); return; }
  const v2 = v.replace(/\s/g, "");
  const h = heroByCn(v) || heroByCn(v2) || (ALIAS[v] && heroByCn(ALIAS[v])) || (ALIAS[v2] && heroByCn(ALIAS[v2]));
  if(!h){ toast("没找到这位英雄，试试输入中文名或外号"); return; }
  $("guessInput").value = "";
  guess(h);
}
function guess(h){
  if(state.mode==="quiz"){ return; }
  if(state.guessed.includes(h.key)){ toast(h.cn + " 已经猜过了"); return; }
  state.guessed.push(h.key);
  const ok = h.key === state.hero.key;
  const mode = state.mode;
  if(mode==="ask"){
    if(!ok){
      state.askCands = state.askCands.filter(x=>x.key!==h.key);
      $("feed").innerHTML = `<div class="row bad">✗ ${h.cn} 不对，已排除（还剩 ${state.askCands.length} 位候选）</div>`;
      const ar = $("askRemain"); if(ar) ar.textContent = `候选英雄：${state.askCands.length} 位`;
    } else {
      $("feed").innerHTML = `<div class="row ok">✓ 猜对了！</div>`;
      win();
    }
  } else if(mode==="classic"){
    addCmpRow(h);
    $("feed").innerHTML = `<div class="row ${ok?"ok":"bad"}">${ok?"✓ 猜对了！":"✗ " + h.cn + " 不对，继续猜（对比表已更新，答案属性都在表里）"}</div>`;
    if(ok) win();
  } else if(mode==="splash" || mode==="skin"){
    zoom = Math.max(1.0, zoom - 0.35);
    applyZoom();
    $("feed").innerHTML = `<div class="row ${ok?"ok":"bad"}">${ok?"✓ 猜对了！":"✗ " + h.cn + " 不是正确答案，画面缩小中…"}</div>`;
    if(ok) win();
  } else if(mode==="title"){
    $("feed").innerHTML = `<div class="row ${ok?"ok":"bad"}">${ok?"✓ 猜对了！":"✗ " + h.cn + "（称号「" + h.title + "」）不是正确答案"}</div>`;
    if(ok) win();
  } else if(mode==="skill" || mode==="quote"){
    $("feed").innerHTML = `<div class="row ${ok?"ok":"bad"}">${ok?"✓ 猜对了！":"✗ " + h.cn + " 不是正确答案"}</div>`;
    if(ok) win();
  }
  renderHintText();
  if(ok && state.mode!=="quiz"){ stats.streak = (stats.streak||0)+1; stats.maxStreak = Math.max(stats.maxStreak||0, stats.streak); saveStats(stats); setStreak(stats.streak); }
  else if(!ok && state.mode!=="quiz"){ stats.streak = 0; saveStats(stats); setStreak(0); }
}
/* ===================== 胜利 ===================== */
function win(){
  const h = state.hero, mode = state.mode;
  stats.total = (stats.total||0) + 1;
  stats.won = (stats.won||0) + 1;
  stats.maxStreak = Math.max(stats.maxStreak||0, stats.streak||0);
  stats.modeWins[mode] = (stats.modeWins[mode]||0) + 1;
  stats.bestTries[mode] = Math.min(stats.bestTries[mode]||99, state.guessed.length);
  stats.heroes[h.key] = (stats.heroes[h.key]||0) + 1;
  saveStats(stats);
  $("mHero").src = h.head;
  $("mName").innerHTML = h.cn + " <span style='color:var(--muted);font-size:13px;'>" + h.title + "</span>";
  $("mTries").textContent = mode==="ask"
    ? "提问 " + (state.askCount||0) + " 次 · 猜测 " + state.guessed.length + " 次"
    : "用了 " + state.guessed.length + " 次猜中" + (state.usedHints? "，提示 " + state.usedHints + " 次":"");
  let statsHtml = "";
  const total = stats.total || 0, won = stats.won || 0, streak = stats.streak || 0;
  const best = stats.bestTries[mode];
  statsHtml += `<div class="bar-row"><span>总对局</span><div class="bar"><i style="width:100%"></i></div><span class="n">${total}</span></div>`;
  statsHtml += `<div class="bar-row"><span>最高连胜</span><div class="bar"><i style="width:${Math.min((stats.maxStreak||0)*10,100)}%"></i></div><span class="n">${stats.maxStreak||0}</span></div>`;
  statsHtml += `<div class="bar-row"><span>本模式最佳</span><div class="bar"><i style="width:${best?Math.min(100/Math.max(best,1),100):0}%"></i></div><span class="n">${best?best+" 次": "-"}</span></div>`;
  statsHtml += `<div class="bar-row"><span>胜率</span><div class="bar"><i style="width:${total?Math.round(won*100/total):100}%"></i></div><span class="n">${total?Math.round(won*100/total):100}%</span></div>`;
  statsHtml += `<div class="bar-row"><span>连胜</span><div class="bar"><i style="width:${Math.min(streak*10,100)}%"></i></div><span class="n">${streak}</span></div>`;
  $("mStats").innerHTML = statsHtml;
  $("mShare").textContent = buildShare(mode, h);
  $("modal").classList.add("show");
}
function buildShare(mode, h){
  const tries = state.guessed.length;
  let tag = "经典模式";
  if(mode==="title") tag = "称号模式";
  else if(mode==="skill") tag = "技能模式";
  else if(mode==="splash") tag = "原画模式";
  else if(mode==="skin") tag = "皮肤模式";
  else if(mode==="quote") tag = "台词模式";
  else if(mode==="quiz") tag = "知识问答";
  else if(mode==="ask") return "王者荣耀猜英雄·提问猜英雄：「" + h.cn + "」问了 " + (state.askCount||0) + " 个问题就猜中了！来挑战 → " + location.origin + location.pathname;
  return "王者荣耀猜英雄·" + tag + "：「" + h.cn + "」用了 " + tries + " 次猜中！来挑战 → " + location.origin + location.pathname;
}
/* ===================== 出题 ===================== */
function nextQuestion(){
  const mode = state.mode;
  $("tblWrap").innerHTML = "";
  $("tblWrap").style.display = "none";
  $("feed").innerHTML = "";
  $("qarea").style.minHeight = "230px";
  $("suggest").classList.remove("show");
  $("guessInput").value = "";
  if(mode==="classic" || mode==="title" || mode==="skill" || mode==="splash"){
    const pool = mode==="skill" ? HEROES.filter(h=>(h.abil||"1111").includes("1")) : HEROES;
    state.hero = pool[Math.floor(Math.random()*pool.length)];
  } else if(mode==="skin"){
    state.skin = SKINS[Math.floor(Math.random()*SKINS.length)];
    state.hero = heroByCn(state.skin.hero);
  } else if(mode==="quote"){
    state.quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
    state.hero = heroByCn(state.quote.hero);
  } else if(mode==="quiz"){
    const z = QUIZ[Math.floor(Math.random()*QUIZ.length)];
    state.quiz = z;
    state.hero = null;
  } else if(mode==="ask"){
    state.hero = HEROES[Math.floor(Math.random()*HEROES.length)];
  }
  renderQuestion();
}
function skip(){
  if(state.mode==="quiz"){
    const z = state.quiz;
    toast("答案是「" + z.opts[z.a] + "」" + (z.note ? "：" + z.note : ""));
    setTimeout(nextQuestion, 1800);
    return;
  }
  const h = state.hero;
  $("feed").insertAdjacentHTML("afterbegin", `<div class="row info">答案是「${h.cn}」${h.title}（${h.class}，${h.lanes.join("/")}）</div>`);
  setTimeout(nextQuestion, 1600);
}
/* ===================== 数据加载 ===================== */
function loadData(){
  fetch("assets/wzry_manifest.json").then(r=>{
    if(!r.ok) throw 0;
    return r.json();
  }).then(d=>{
    if(!d || !Array.isArray(d.heroes)) throw 0;
    HEROES = d.heroes;
    boot();
  }).catch(()=>{
    HEROES = FALLBACK.heroes;
    boot();
  });
}
function boot(){
  /* 提示线索预计算：上线顺序 / 外号个数 / 同职业人数 */
  try{
    const cc = {};
    HEROES.forEach(x=>{ cc[x.class] = (cc[x.class]||0)+1; });
    HEROES.forEach(x=>{ x._classCnt = cc[x.class]; x._aliasCnt = (x.alias||[]).filter(a=>a!==x.cn).length; });
    [...HEROES].sort((a,b)=>(a.year||0)-(b.year||0) || String(a.time||"").localeCompare(String(b.time||""))).forEach((x,i)=>{ x._rank = i+1; });
  }catch(e){}
  state = {mode:"classic", maxTries:8, usedHints:0, guessed:[]};
  setStreak(stats.streak || 0);
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      state.mode = t.dataset.mode;
      state.maxTries = 8;
      nextQuestion();
    };
  });
  $("guessBtn").onclick = doGuess;
  $("guessInput").addEventListener("keydown", e=>{
    if(e.key==="ArrowDown" && sugItems.length){ e.preventDefault(); sugSel=Math.min(sugSel+1,sugItems.length-1); paintSug(); }
    else if(e.key==="ArrowUp" && sugItems.length){ e.preventDefault(); sugSel=Math.max(sugSel-1,0); paintSug(); }
    else if(e.key==="Enter"){ if(sugSel>=0 && sugItems[sugSel]){ $("guessInput").value=sugItems[sugSel].cn; $("suggest").classList.remove("show"); doGuess(); } else doGuess(); }
    else showSuggest();
  });
  $("guessInput").addEventListener("input", showSuggest);
  document.addEventListener("click", e=>{
    if(!e.target.closest(".guess-input-wrap")) $("suggest").classList.remove("show");
  });
  $("hintBtn").onclick = hint;
  $("skipBtn").onclick = skip;

/* ===== 分享 ===== */
function shareResult(){
  const text = $("mShare").textContent || "";
  const link = location.origin + location.pathname;
  const full = text + " " + link;
  if(navigator.share){
    navigator.share({title:"柿子eeeee · 猜英雄", text, url: location.href})
      .then(()=>{})
      .catch(()=>copyText(full));
    return;
  }
  copyText(full);
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("分享文案已复制，去微信粘贴吧")).catch(()=>copyFallback(t));
  } else copyFallback(t);
}
function copyFallback(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("分享文案已复制，去微信粘贴吧"); }
  catch(e){ toast("复制失败，请长按文字手动复制"); }
  document.body.removeChild(ta);
}


/* ===== 分享面板 ===== */
function openShare(){
  const mode = state.mode || "classic";
  let text = "";
  try{
    if(state.hero) text = buildShare(mode, state.hero, state.used || state.guessed.length || 0);
  }catch(e){}
  if(!text) text = document.title + "：来挑战吧！";
  $("shareModalText").textContent = text + "  " + location.origin + location.pathname;
  const qr = $("shareQr");
  qr.innerHTML = "";
  try{
    if(typeof QRCode !== "undefined"){
      new QRCode(qr, {text: location.href, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M});
    } else {
      qr.innerHTML = `<div style="color:#333;font-size:12px;padding:6px;word-break:break-all;max-width:200px;">${location.href}</div>`;
    }
  }catch(e){
    qr.innerHTML = `<div style="color:#333;font-size:12px;padding:6px;word-break:break-all;max-width:200px;">${location.href}</div>`;
  }
  $("shareModal").classList.add("show");
}
function shareFromPanel(sys){
  const text = $("shareModalText").textContent || location.href;
  if(sys && navigator.share){
    navigator.share({title: document.title, text, url: location.href}).catch(()=>copyText(text));
  } else {
    copyText(text);
  }
}

  $("mAgain").onclick = ()=>{ $("modal").classList.remove("show"); nextQuestion(); };
  $("mShareBtn").onclick = shareResult;
  $("topShareBtn").onclick = openShare;
  $("shareCopyBtn").onclick = ()=>shareFromPanel(false);
  $("shareSysBtn").onclick = ()=>shareFromPanel(true);
  $("shareCloseBtn").onclick = ()=>{ $("shareModal").classList.remove("show"); };
  $("shareModal").onclick = e=>{ if(e.target === $("shareModal")) $("shareModal").classList.remove("show"); };
  $("mCopy").onclick = ()=>{
    const t = $("mShare").textContent;
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制，去分享吧"); }catch(e){ toast("复制失败，请手动复制"); }
    ta.remove();
  };
  nextQuestion();
}
function paintSug(){
  document.querySelectorAll(".sug-item").forEach((it,i)=>it.classList.toggle("sel", i===sugSel));
}
loadData();
</script>
<script>
/* 移除平台右下角水印角标（shadow DOM .watermark-root，直接移除节点，防重注入轮询） */
(function(){
  function killBadge(){
    try{
      var list = document.querySelectorAll('body > div');
      for(var i=0;i<list.length;i++){
        var d = list[i];
        if(d.shadowRoot && d.shadowRoot.querySelector('.watermark-root')){
          if(d.parentNode) d.parentNode.removeChild(d);
        }
      }
    }catch(e){}
  }
  killBadge();
  new MutationObserver(killBadge).observe(document.body,{childList:true});
  setInterval(killBadge, 300);
})();
</script>
